                        if(!state.users.length){ try{ const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false}); if(error) throw error; state.users=data||[]; }catch(err){ return showToast('تعذر تحميل قائمة المستخدمين: '+err.message,'error'); } }
                        openModal('add-item', {visibilityMode:'all',allowedUsers:[],excludedUsers:[],textBold:true,textColor:'#111827'});
                    }
                    break;
                }

                // ─── Admin: Edit Item ───
                case 'edit-item': {
                    if (isAdmin()) {
                        const item = findItem(state.currentSectionId, state.currentSubId, el.dataset.item);
                        if (item) {
                            if(!state.users.length){ try{ const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false}); if(error) throw error; state.users=data||[]; }catch(err){ return showToast('تعذر تحميل قائمة المستخدمين: '+err.message,'error'); } }
                            openModal('item', { name: item.name, image: item.image, fileName: item.fileName, fileData: item.fileData, targetId: item.id, visibilityMode:item.visibilityMode||'all', allowedUsers:item.allowedUsers||[], excludedUsers:item.excludedUsers||[], ownerId:item.ownerId||state.user?.id||null, textBold:item.textBold!==false, textColor:item.textColor||'#111827' });
                        }
                    }
                    break;
                }

                // ─── Admin: Delete Item ───
                case 'delete-item': {
                    if(isAdmin()){
                        const itemId=el.dataset.item;
                        askConfirm('هل أنت متأكد من حذف هذا المستطيل؟',async()=>{
                            try{const item=findItem(state.currentSectionId,state.currentSubId,itemId);if(!item)throw new Error('المستطيل غير موجود');
                                if(item.dbId){const {error}=await sb.from('materials').delete().eq('id',item.dbId);if(error)throw error;}
                                closeConfirm();await loadData();render();showToast('تم حذف المستطيل من قاعدة البيانات','success');
                            }catch(err){closeConfirm();showToast(`تعذر الحذف: ${err.message}`,'error');}});
                    }
                    break;
                }

                // ─── Admin: Reorder Item (move rectangle up/down) ───
                case 'move-item-up':
                case 'move-item-down': {
                    if (!isAdmin()) break;
                    const sub = findSub(state.currentSectionId, state.currentSubId);
                    if (!sub) break;
                    const list = sub.items;
                    const idx = list.findIndex(it => it.id === el.dataset.item);
                    const dir = act === 'move-item-up' ? -1 : 1;
                    const targetIdx = idx + dir;
                    if (idx < 0 || targetIdx < 0 || targetIdx >= list.length) break;
                    const current = list[idx], target = list[targetIdx];
                    try {
                        const firstOrder = Number(current.sortOrder ?? idx), secondOrder = Number(target.sortOrder ?? targetIdx);
                        const results = await Promise.all([
                            sb.from('materials').update({ sort_order: secondOrder }).eq('id', current.dbId),
                            sb.from('materials').update({ sort_order: firstOrder }).eq('id', target.dbId)
                        ]);
                        const err = results.find(r => r.error)?.error;
                        if (err) throw err;
                        await loadData();
                        render();
                    } catch (err) { showToast(err?.message || 'تعذر تغيير ترتيب المستطيلات.', 'error'); }
                    break;
                }

                // ─── Admin: Save Modal ───
                case 'save-modal': {
                    await saveModal();
                    break;
                }

                // ─── Admin: Delete Modal ───
                case 'delete-modal': {
                    const m = state.modal;
                    if (!m) return;
                    if (m.kind === 'section') {
                        const id = m.targetId;
                        closeModal();
                        askConfirm('هل أنت متأكد من حذف هذا القسم وكل محتوياته؟', () => {
                            state.sections = state.sections.filter(s => s.id !== id);
                            saveData();
                            closeConfirm();
                            go('home');
                            showToast('تم حذف القسم', 'success');
                        });
                    } else if (m.kind === 'sub') {
                        const id = m.targetId;
                        closeModal();
                        askConfirm('هل أنت متأكد من حذف هذا القسم الفرعي وكل محتوياته؟', () => {
                            const section = findSection(state.currentSectionId);
                            if (section) {
                                section.subs = section.subs.filter(s => s.id !== id);
                                saveData();
                            }
                            closeConfirm();
                            render();
                            showToast('تم حذف القسم الفرعي', 'success');
                        });
                    } else if (m.kind === 'item') {
                        const id = m.targetId;
                        closeModal();
                        askConfirm('هل أنت متأكد من حذف هذا المستطيل؟', () => {
                            const sub = findSub(state.currentSectionId, state.currentSubId);
                            if (sub) {
                                sub.items = sub.items.filter(i => i.id !== id);
                                saveData();
                            }
                            closeConfirm();
                            render();
                            showToast('تم حذف المستطيل', 'success');
                        });
                    }
                    break;
                }

                case 'confirm-yes': {
                    if (state.confirm && state.confirm.onYes) {
                        state.confirm.onYes();
                    }
                    break;
                }

                default:
                    break;
            }
        }

        // ─── Save Modal Data ───

        async function saveModal(){
            const m=state.modal; if(!m)return; if(!isAdmin()){showToast('غير مصرح به','error');return;}
            const btn=document.querySelector('[data-act="save-modal"]'); if(btn){btn.disabled=true;btn.textContent='جاري الرفع والحفظ…';}
            try{
                const nameInput=document.getElementById('modal-name'); if(nameInput)m.name=nameInput.value.trim();
                if((m.kind==='add-section'||m.kind==='section'||m.kind==='add-sub'||m.kind==='sub') && !m.name)throw new Error('اكتب اسم القسم أو القسم الفرعي أولًا.');
                const imageBucket=(m.kind==='item'||m.kind==='add-item')?'materials':(m.kind==='sub'||m.kind==='add-sub'?'subcategories':'categories');
                const imagePath=m.imageFile?await uploadFile(imageBucket,m.imageFile,'images'):(m.image&&!String(m.image).startsWith('blob:')?m.image:null);
                const filePath=m.fileFile?await uploadFile('materials',m.fileFile,'files'):(m.fileData&&!String(m.fileData).startsWith('data:')?m.fileData:null);
                m.visibilityMode=document.getElementById('content-visibility')?.value||m.visibilityMode||'all'; m.textBold = m.textBold !== false; m.textColor = m.textColor || '#111827'; m.allowedUsers=[...(document.getElementById('content-allow-users')?.selectedOptions||[])].map(o=>o.value); m.excludedUsers=[...(document.getElementById('content-deny-users')?.selectedOptions||[])].map(o=>o.value);
                const announceEnabled = (m.kind==='item'||m.kind==='add-item') && !!document.getElementById('announce-on-publish')?.checked;
                const announceAudienceMode = document.getElementById('announce-audience-mode')?.value||'all';
                const announceUserIds = [...(document.getElementById('announce-users')?.selectedOptions||[])].map(o=>o.value);
                const announceExcludedUserIds = [...(document.getElementById('announce-excluded')?.selectedOptions||[])].map(o=>o.value);
                const announceTitleInput = (document.getElementById('announce-title')?.value||'رفع ملف جديد 🙂').trim() || 'رفع ملف جديد 🙂';
                const announceFileName = m.fileFile?.name || m.fileName || m.name || 'ملف';
                const authUserForSave = await getCurrentAuthUser();
                const ownerId=m.ownerId||authUserForSave.id||state.user?.id||null;
                if(m.kind==='add-section'){
                    const {data:newRow,error}=await sb.from('categories').insert({name:m.name,image_path:imagePath,sort_order:state.sections.length,is_active:true,visibility_mode:m.visibilityMode||'all',owner_id:ownerId,text_bold:m.textBold,text_color:m.textColor}).select('id').single();if(error)throw error;
                    const rows=[...(m.allowedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({category_id:newRow.id,user_id,access_type:'allow'})),...(m.excludedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({category_id:newRow.id,user_id,access_type:'deny'}))]; if(rows.length){const {error:e}=await sb.from('category_user_access').insert(rows);if(e)throw e;}
                } else if(m.kind==='section'){
                    const section=findSection(m.targetId);if(!section)throw new Error('القسم غير موجود');const patch={name:m.name,visibility_mode:m.visibilityMode||'all',owner_id:ownerId,text_bold:m.textBold,text_color:m.textColor};if(imagePath)patch.image_path=imagePath;const {error}=await sb.from('categories').update(patch).eq('id',section.dbId);if(error)throw error;
                    await sb.from('category_user_access').delete().eq('category_id',section.dbId); const rows=[...(m.allowedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({category_id:section.dbId,user_id,access_type:'allow'})),...(m.excludedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({category_id:section.dbId,user_id,access_type:'deny'}))]; if(rows.length){const {error:e}=await sb.from('category_user_access').insert(rows);if(e)throw e;}
                } else if(m.kind==='add-sub'){
                    const section=findSection(state.currentSectionId);if(!section)throw new Error('اختر قسمًا أولًا');const {data:newRow,error}=await sb.from('subcategories').insert({category_id:section.dbId,name:m.name,image_path:imagePath,sort_order:section.subs.length,visibility_mode:m.visibilityMode||'all',owner_id:ownerId,text_bold:m.textBold,text_color:m.textColor}).select('id').single();if(error)throw error;
                    const rows=[...(m.allowedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({subcategory_id:newRow.id,user_id,access_type:'allow'})),...(m.excludedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({subcategory_id:newRow.id,user_id,access_type:'deny'}))]; if(rows.length){const {error:e}=await sb.from('subcategory_user_access').insert(rows);if(e)throw e;}
                } else if(m.kind==='sub'){
                    const sub=findSub(state.currentSectionId,m.targetId);if(!sub)throw new Error('القسم الفرعي غير موجود');const patch={name:m.name,visibility_mode:m.visibilityMode||'all',owner_id:ownerId,text_bold:m.textBold,text_color:m.textColor};if(imagePath)patch.image_path=imagePath;const {error}=await sb.from('subcategories').update(patch).eq('id',sub.dbId);if(error)throw error;
                    await sb.from('subcategory_user_access').delete().eq('subcategory_id',sub.dbId); const rows=[...(m.allowedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({subcategory_id:sub.dbId,user_id,access_type:'allow'})),...(m.excludedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({subcategory_id:sub.dbId,user_id,access_type:'deny'}))]; if(rows.length){const {error:e}=await sb.from('subcategory_user_access').insert(rows);if(e)throw e;}
                }
                else if(m.kind==='add-item'){const sub=findSub(state.currentSectionId,state.currentSubId);if(!sub)throw new Error('اختر قسمًا فرعيًا أولًا');if(sub.items.length>=30)throw new Error('وصلت للحد الأقصى (30 مستطيل)');const {data:newItem,error}=await sb.from('materials').insert({title:m.name||null,image_path:imagePath||null,file_path:filePath||null,subcategory_id:sub.dbId,sort_order:sub.items.length,is_active:true,visibility_mode:m.visibilityMode||'all',owner_id:ownerId,text_bold:m.textBold,text_color:m.textColor}).select('id').single();if(error)throw error; const accessRows=[...(m.allowedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({material_id:newItem.id,user_id,access_type:'allow'})), ...(m.excludedUsers||[]).filter(id=>id!==ownerId).map(user_id=>({material_id:newItem.id,user_id,access_type:'deny'}))]; if(accessRows.length){const {error:ae}=await sb.from('material_user_access').insert(accessRows);if(ae)throw ae;}}

                    await sb.from('material_user_access').delete().eq('material_id',item.dbId);

                await loadData();closeModal();render();showToast('تم الحفظ في قاعدة البيانات وStorage بنجاح','success');
                if(announceEnabled && filePath){
                    let targetType='all', targetUserIds=[];
                    if(announceAudienceMode==='selected'){ targetType='selected'; targetUserIds=announceUserIds; }
                    else if(announceAudienceMode==='excluded'){ targetType='excluded'; targetUserIds=[]; }
                    const announceTitle=announceTitleInput;
                    const announceBody=`تم رفع ${announceFileName}${announceSubName?` في ${announceSubName}`:''}`;
                    if(announceAudienceMode==='selected' && !targetUserIds.length){
                        showToast('إعلان بالنشر: اخترت "أشخاص محددون" بدون تحديد أي شخص، فمتبعتش إشعار.','error');
                    } else if(window.confirm(`هيتبعت الإشعار ده:\n\nالعنوان: ${announceTitle}\nالموضوع: ${announceBody}\n\nتوافق على الإرسال؟`)){
                        try{
                            const {error}=await sb.rpc('midad_notif_center_admin_send', {
                                p_title: announceTitle,
                                p_body: announceBody,
                                p_target_type: targetType,
                                p_target_user_ids: targetUserIds,

                            showToast('اتبعت الإشعار.','success');

                    }
                }
            }catch(err){console.error('saveModal',err);showToast(err.message||'تعذر الحفظ. راجع Storage/RLS في Supabase.','error');}
            finally{if(btn){btn.disabled=false;btn.textContent='حفظ';}}
        }

        function initSessionDragon(){
            try{
                const screen = document.getElementById('session-dragon-screen');
                if(!screen) return;
                const xlinkns = 'http://www.w3.org/1999/xlink';
                let width = window.innerWidth, height = window.innerHeight;
                const N = 40;
                const elems = [];
                for (let i = 0; i < N; i++) elems[i] = { use: null, x: width / 2, y: 0 };
                const pointer = { x: width / 2, y: height / 2 };
                const radm = Math.min(pointer.x, pointer.y) - 20;
                let frm = Math.random();
                let rad = 0;
                const prepend = (use, i) => {
                    const elem = document.createElementNS('http://www.w3.org/2000/svg', 'use');
                    elems[i].use = elem;
                    elem.setAttributeNS(xlinkns, 'xlink:href', '#' + use);
                    screen.prepend(elem);
                };
                for (let i = 1; i < N; i++) {
                    if (i === 1) prepend('Cabeza', i);
                    else if (i === 8 || i === 14) prepend('Aletas', i);
                    else prepend('Espina', i);
                }
                const onMove = (e) => { pointer.x = e.clientX; pointer.y = e.clientY; rad = 0; };
                const onResize = () => { width = window.innerWidth; height = window.innerHeight; };
                window.addEventListener('pointermove', onMove, false);
                window.addEventListener('resize', onResize, false);
                let alive = true;
                const cleanup = () => {
                    if(!alive) return; alive = false;
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('resize', onResize);
                };
                state._sessionDragonCleanup = cleanup;
                const run = () => {
                    if(!document.body.contains(screen)){ cleanup(); return; }
                    requestAnimationFrame(run);
                    let e0 = elems[0];
                    const ax = (Math.cos(3 * frm) * rad * width) / height;
                    const ay = (Math.sin(4 * frm) * rad * height) / width;
                    e0.x += (ax + pointer.x - e0.x) / 10;
                    e0.y += (ay + pointer.y - e0.y) / 10;
                    for (let i = 1; i < N; i++) {
                        let e = elems[i]; let ep = elems[i - 1];
                        const a = Math.atan2(e.y - ep.y, e.x - ep.x);
                        e.x += (ep.x - e.x + (Math.cos(a) * (100 - i)) / 5) / 4;
                        e.y += (ep.y - e.y + (Math.sin(a) * (100 - i)) / 5) / 4;
                        const s = (162 + 4 * (1 - i)) / 50;
                        e.use.setAttributeNS(null, 'transform', `translate(${(ep.x + e.x) / 2},${(ep.y + e.y) / 2}) rotate(${a * 57.29577951308232}) scale(${s},${s})`);
                    }
                    if (rad < radm) rad++;
                    frm += 0.003;
                    if (rad > 60) {
                        pointer.x += (width / 2 - pointer.x) * 0.05;
                        pointer.y += (height / 2 - pointer.y) * 0.05;
                    }
                };
                run();
            }catch(e){ console.warn('session dragon init failed', e); }
        }

        function enhanceAccessMultiSelects(){
            document.querySelectorAll('select.access-multi[multiple]').forEach(sel=>{
                if(sel.dataset.enhanced==='1') return;
                sel.dataset.enhanced='1';
                sel.style.display='none';
                const options=[...sel.options];
                const wrap=document.createElement('div');
                wrap.className='user-picker';
                const countLabel=()=>{const n=options.filter(o=>o.selected).length; return n?`${n} محدد`:'لا يوجد اختيار';};
                wrap.innerHTML=`
                  <div class="user-picker-search"><i class="fas fa-magnifying-glass"></i><input type="text" class="user-picker-search-input" placeholder="ابحث بالاسم أو البريد..."></div>
                  <div class="user-picker-toolbar">
                    <button type="button" class="user-picker-mini-btn" data-picker-act="all">تحديد الكل</button>
                    <button type="button" class="user-picker-mini-btn" data-picker-act="none">إلغاء الكل</button>
                    <span class="user-picker-count">${countLabel()}</span>
                  </div>
                  <div class="user-picker-list">
                    ${options.length? options.map((o,i)=>{
                        const label=o.textContent||'';
                        const parts=label.split(' — ');
                        const name=parts[0]||label; const email=parts[1]||'';
                        const initial=(name.trim()[0]||'؟').toUpperCase();
                        return `<label class="user-picker-row ${o.selected?'checked':''}" data-idx="${i}"><input type="checkbox" ${o.selected?'checked':''}><span class="user-picker-avatar">${initial}</span><span class="user-picker-info"><span class="user-picker-name">${name}</span>${email?`<span class="user-picker-email">${email}</span>`:''}</span></label>`;
                    }).join('') : '<div class="user-picker-empty">لا يوجد حسابات متاحة</div>'}
                  </div>`;
                sel.insertAdjacentElement('afterend', wrap);
                const countEl=wrap.querySelector('.user-picker-count');
                const rows=[...wrap.querySelectorAll('.user-picker-row')];
                const sync=()=>{ countEl.textContent=countLabel(); };
                rows.forEach(row=>{
                    const idx=+row.dataset.idx;
                    const cb=row.querySelector('input[type=checkbox]');
                    cb.addEventListener('change',()=>{
                        options[idx].selected=cb.checked;
                        row.classList.toggle('checked',cb.checked);
                        sel.dispatchEvent(new Event('change',{bubbles:true}));
                        sync();
                    });
                });
                wrap.querySelector('.user-picker-search-input').addEventListener('input',e=>{
                    const q=e.target.value.trim().toLowerCase();
                    rows.forEach(row=>{
                        const txt=row.textContent.toLowerCase();
                        row.style.display=(!q||txt.includes(q))?'flex':'none';
                    });
                });
                wrap.querySelectorAll('[data-picker-act]').forEach(btn=>{
                    btn.addEventListener('click',()=>{
                        const on=btn.dataset.pickerAct==='all';
                        rows.forEach(row=>{
                            if(row.style.display==='none') return;
                            const idx=+row.dataset.idx; const cb=row.querySelector('input[type=checkbox]');
                            cb.checked=on; options[idx].selected=on; row.classList.toggle('checked',on);
                        });
                        sel.dispatchEvent(new Event('change',{bubbles:true}));
                        sync();
                    });
                });
            });
        }

        function wireNiceFileInput(inputId, opts={}){
            const input=document.getElementById(inputId);
            if(!input || input.dataset.niceWired==='1') return;
            input.dataset.niceWired='1';
            const preview=document.getElementById(inputId+'-preview');
            const label=document.querySelector(`label.nice-file-label[for="${inputId}"]`);
            input.addEventListener('change',()=>{
                const file=input.files?.[0];
                if(inputId === 'welcome-video-file'){
                    if(label){ const span=label.querySelector('span'); if(span) span.textContent=file ? 'فيديو جاهز للحفظ' : (opts.defaultLabel||'اضغط لاختيار فيديو أو اسحبه هنا'); }
                    if(preview){
                        if(!file){ preview.className='nice-file-preview'; preview.innerHTML=''; }
                        else{
                            const url=URL.createObjectURL(file);
                            const sizeMb=(file.size/1024/1024).toFixed(1);
                            preview.innerHTML=`<video src="${url}" controls playsinline preload="metadata"></video><div class="welcome-video-upload-ready"><i class="fas fa-circle-check"></i><span title="${escapeHtml(file.name)}">${escapeHtml(file.name)} · ${sizeMb} MB — جاهز للحفظ</span><button type="button" class="nice-file-remove" data-clear-for="${inputId}">إزالة</button></div>`;
                            preview.className='nice-file-preview show';
                        }
                    }
                    return;
                }
                if(!preview) return;
                if(!file){ preview.className='nice-file-preview'; preview.innerHTML=''; return; }
                const url=URL.createObjectURL(file);
                const sizeMb=(file.size/1024/1024).toFixed(1);
                let mediaHtml='';
                if(file.type.startsWith('video/')) mediaHtml=`<video src="${url}" controls playsinline preload="metadata"></video>`;
                else if(file.type.startsWith('image/')) mediaHtml=`<img src="${url}" alt="">`;
                preview.innerHTML=`${mediaHtml}<div class="nice-file-preview-meta"><i class="fas fa-paperclip"></i><span>${file.name}</span><span>· ${sizeMb} MB</span><button type="button" class="nice-file-remove" data-clear-for="${inputId}">إزالة</button></div>`;
                preview.className='nice-file-preview show';
                if(label){ const span=label.querySelector('span'); if(span) span.textContent=file.name; }
            });
            if(preview){
                preview.addEventListener('click',e=>{
                    const btn=e.target.closest('[data-clear-for]');
                    if(!btn) return;
                    input.value='';
                    preview.className='nice-file-preview'; preview.innerHTML='';
                    if(label){ const span=label.querySelector('span'); if(span) span.textContent=opts.defaultLabel||'اضغط لاختيار ملف أو اسحبه هنا'; }
                });
            }
        }

        function wireWelcomeVideoPlaybackFallback(){
            if(document.documentElement.dataset.wvPlaybackFallback==='1') return;
            document.documentElement.dataset.wvPlaybackFallback='1';
            document.addEventListener('error',async(event)=>{
                const video=event.target;
                if(!video || video.tagName!=='VIDEO') return;
                const path=video.dataset.wvPreviewPath||video.dataset.wvThumbPath||'';
                if(!path || video.dataset.wvRetried==='1') return;
                video.dataset.wvRetried='1';
                const url=await getWelcomeVideoSignedUrl(path);
                if(url && url!==video.src){
                    video.src=url;
                    try{ video.load(); }catch(_){}
                }
            },true);
        }

        function welcomeVideoDisplayName(name){
            let n=String(name||'فيديو بدون اسم').split('/').pop();
            n=n.replace(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_/i,'');
            n=n.replace(/^[0-9a-f]{32}_/i,'');

        async function getWelcomeVideoSignedUrl(path){
            if(!path) return '';
            try{
                const {data,error}=await sb.storage.from('welcome-videos').createSignedUrl(path,3600);
                if(error) throw error;
                return data?.signedUrl||'';
            }catch(_){ return ''; }
        }

        async function deleteWelcomeVideoObject(path){
            if(!path) throw new Error('مسار الفيديو غير موجود.');
            const campaign=state.welcomeVideoCampaign||{};
            const selectedPath=state.welcomeVideoDraftPath||campaign.video_path||'';
            const affectsCurrent=selectedPath===path || campaign.video_path===path;
            if(affectsCurrent){
                const audience=campaign.audience_mode==='selected'?'selected':'all';
                const ids=Array.isArray(campaign.recipient_ids)?campaign.recipient_ids:[];
                const {error:assignmentError}=await sb.rpc('midad_admin_save_welcome_video',{
                    p_video_path:'',
                    p_audience_mode:audience,
                    p_user_ids:ids,
                    p_is_active:campaign.is_active!==false
                });
                if(assignmentError) throw assignmentError;
            }
            const {error}=await sb.storage.from('welcome-videos').remove([path]);
            if(error) throw error;
            state.welcomeVideoDraftPath = affectsCurrent ? '' : selectedPath;
            await Promise.all([loadWelcomeVideoLibrary(),loadWelcomeVideoCampaign(),loadWelcomeVideoRecipientsStatus()]);
        }

async function listWelcomeVideoObjects(path=''){
            const out=[];
            try{
                const {data,error}=await sb.storage.from('welcome-videos').list(path,{limit:100,offset:0,sortBy:{column:'name',order:'asc'}});
                if(error) throw error;
                for(const item of (data||[])){
                    if(!item?.name) continue;
                    const childPath=path ? `${path}/${item.name}` : item.name;
                    const isFolder=!item.id && !item.metadata;
                    if(isFolder){
                        const nested=await listWelcomeVideoObjects(childPath);
                        out.push(...nested);
                    }else{
                        const ext=(item.name.split('.').pop()||'').toLowerCase();
                        if(['mp4','webm','mov','m4v'].includes(ext)) out.push({path:childPath,name:item.name,size:item.metadata?.size||0,updated:item.updated_at||item.created_at||''});
                    }
                }
            }catch(err){
                // Never turn an RLS/Storage error into an empty library.
                // That was the reason an uploaded video appeared briefly and
                // disappeared after the next render.
                console.warn('welcome video library',err);
                throw err;
            }
            return out;

            const overlay=document.createElement('div'); overlay.className='welcome-video-overlay show';
            overlay.innerHTML=`<div class="welcome-video-shell"><video class="welcome-video" playsinline preload="auto" autoplay></video><div class="welcome-video-sound-gate" style="display:none"><button type="button" class="welcome-video-sound-btn">🔊 تشغيل الفيديو بالصوت</button></div></div>`;
            document.body.appendChild(overlay); const video=overlay.querySelector('video'), gate=overlay.querySelector('.welcome-video-sound-gate');
            video.src=url; video.muted=false; video.volume=1; let done=false;
            const finish=async()=>{if(done)return;done=true;await markWelcomeVideoViewed();overlay.remove();if(typeof onDone==='function') onDone();};
            const fail=()=>{if(done)return;done=true;overlay.remove();if(typeof onDone==='function') onDone();};

        async function loadPlatformManager(){
            try{
                const {data,error}=await sb.from('platform_profile').select('*').eq('id',1).maybeSingle();
                if(error) throw error;
                if(data){ state.platformManager={id:data.id,name:data.public_name||'مدير المنصة',titles:Array.isArray(data.public_titles)?data.public_titles:[],message:data.public_message||'',avatar:publicStorageUrl('avatars',data.avatar_path||''),avatar_path:data.avatar_path||null,version:data.public_version||'3',news_items:Array.isArray(data.news_items)?data.news_items:[]}; }
            }catch(_){ /* لا تمنع فتح المنصة إذا لم يكن سجل المدير موجودًا بعد */ }
        }

        async function bootApp(){
            try{
                const startupGuard = new URLSearchParams(location.search).get('startupGuard') === '1';
                const offlineNow = typeof navigator !== 'undefined' && navigator.onLine === false;
                let session = null;
                const sessionTimeout = offlineNow ? 900 : 2200;
                for(let attempt=0; attempt < (startupGuard ? 3 : 1); attempt++) {
                    try {
                        const r = await Promise.race([
                            sb.auth.getSession(),
                            new Promise((_,reject)=>setTimeout(()=>reject(new Error('SESSION_RESTORE_TIMEOUT')), sessionTimeout))
                        ]);
                        session = r?.data?.session || null;
                        if(session?.user) break;
                    } catch(e) {}
                    if(!session?.user && attempt < 2) await new Promise(r=>setTimeout(r,250));
                }
                if(!session?.user){
                    renderAccessMessage(offlineNow?'لا يوجد اتصال بالإنترنت':'لا توجد جلسة دخول',
                        offlineNow?'افتح التطبيق مرة واحدة مع الإنترنت لتهيئة وضع Offline.':'سجّل الدخول أولًا ثم افتح التطبيق مرة أخرى.',
                        'العودة لبداية الموقع',{sessionGuard:true});
                    return;
                }
                currentAuthUser = session.user;

                // Cache-first boot: render the last authenticated state immediately.
                const cached=ivReadAppCache(session.user.id);
                const restored=!!(cached && ivRestoreAppCache(session.user.id));
                if(restored){
                    resetNavigation('home');
                    render();
                }

                // Offline means: never wait for Supabase profile/data requests.
                if(offlineNow){
                    if(restored){
                        showToast('وضع Offline مفعل — تعرض البيانات المحفوظة على الجهاز.','info');
                        return;
                    }
                    renderAccessMessage('لا يوجد اتصال بالإنترنت','لم يتم حفظ بيانات هذا الحساب على الجهاز بعد. اتصل بالإنترنت مرة واحدة لتهيئة وضع Offline.');
                    return;
                }

                // Online profile validation is bounded so a slow network cannot hide
                // the already-rendered cached shell.
                let profile=null, profileError=null;
                try{
                    const r=await Promise.race([
                        sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle(),
                        new Promise((_,reject)=>setTimeout(()=>reject(new Error('PROFILE_LOAD_TIMEOUT')),2500))
                    ]);
                    profile=r.data||null; profileError=r.error||null;
                }catch(e){ profileError=e; }

                if(profileError){
                    if(restored){
                        showToast('تم تشغيل التطبيق من البيانات المحفوظة. ستتم المزامنة عند استقرار الاتصال.','info');
                        return;
                    }
                    if(isOfflineFailure(profileError)){
                        renderAccessMessage('لا يوجد اتصال بالإنترنت','لم يتم حفظ بيانات هذا الحساب على الجهاز بعد. اتصل بالإنترنت مرة واحدة لتهيئة وضع Offline.');
                        return;
                    }
                    throw profileError;
                }
                if(!profile){
                    renderAccessMessage('الحساب غير مكتمل','لا يوجد سجل لهذا المستخدم في profiles.');
                    return;
                }
                const admin=profile.role==='admin';
                if(!admin&&profile.status==='revoked'){renderAccessMessage('الحساب موقوف','تواصل مع الإدارة لإعادة التفعيل.');return;}
                if(!admin&&profile.status==='pending'){renderAccessMessage('الحساب في انتظار الموافقة','بعد الموافقة ستتمكن من الدخول.');return;}
                if(!admin&&(profile.must_change_credentials||profile.account_type==='temporary'||profile.is_temporary===true)){renderAccessMessage('الحساب مؤقت','ارجع للموقع من البداية وأكمل بيانات الحساب أولًا.');return;}
                if(!admin&&profile.must_change_password){renderAccessMessage('تغيير كلمة السر مطلوب','ارجع للموقع من البداية لتعيين كلمة سر جديدة قبل دخول الموقع.');return;}
                state.role=profile.role==='super_admin'?'super_admin':(admin?'admin':(profile.role==='moderator'?'moderator':'member'));
                state.user={id:profile.id||session.user.id, name:profile.full_name||profile.name||session.user.user_metadata?.full_name||'عضو',email:profile.email||session.user.email||'',phone:profile.phone_number||profile.phone||'',avatar:publicStorageUrl('avatars',profile.avatar_path||profile.avatar_url), profile_title:profile.profile_title||'', visible_titles:(profile.visible_titles!=null?profile.visible_titles:null), isOwnerAdmin:!!profile.is_owner_admin};
                ivWriteAppCache(state.user.id);

                const firstOpen=!profile.first_opened_at&&!profile.first_seen_at;

                // Start all network-backed data only after the UI is already visible.
                const refreshPromise=Promise.allSettled([
                    loadData(),loadPlatformManager(),loadWelcomeVideoCampaign(),
                    loadPlatformButtons(),loadNotifCenter(),loadDragonControls()
                ]).then(async results=>{
                    const coreFailed=results[0]?.status==='rejected';
                    if(coreFailed && restored) ivRestoreAppCache(state.user.id);
                    render();

                    if(navigator.onLine!==false){
                        try{
                            const {data:messages,error:messagesError}=await sb.rpc('midad_get_my_admin_messages');
                            if(!messagesError && Array.isArray(messages) && messages.length){
                                state.pendingUserMessages=messages;
                                ivWriteAppCache(state.user.id);
                                if(state.user.phone && !state.modal) openModal('user-message',{messages});
                            }
                        }catch(_){}
                    }
                    if(!state.user.phone && !state.modal && navigator.onLine!==false) openModal('phone-required',{});
                    try{
                        await showWelcomeVideoOnce(()=>{if(firstOpen) openModal('first-welcome',{});});
                    }catch(_){}
                });

                // If there was no cache, render the authenticated shell now, before
                // waiting for categories/materials/videos/other network data.
                if(!restored){
                    resetNavigation('home');
                    render();
                }
                void refreshPromise;
            }catch(e){
                console.error('bootApp',e);
                if(isOfflineFailure(e) && state.user?.id && ivRestoreAppCache(state.user.id)){
                    resetNavigation('home'); render();
                    showToast('وضع Offline مفعل — تعرض البيانات المحفوظة على الجهاز.','info');
                    return;
                }
                renderAccessMessage(navigator.onLine===false?'لا يوجد اتصال بالإنترنت':'تعذر بدء التطبيق',
                    navigator.onLine===false?'يمكنك استخدام المحتوى المحفوظ على الجهاز، وسيتم التحديث عند عودة الإنترنت.':friendlyAuthError(e,'حدث خطأ أثناء بدء التطبيق. حاول مرة أخرى.'));
            }
        }
        let ivOnlineRefreshRunning=false;
        async function ivRefreshAfterReconnect(){
            if(ivOnlineRefreshRunning || !state.user?.id) return;
            ivOnlineRefreshRunning=true;
            try{
                await Promise.allSettled([loadData(),loadPlatformManager(),loadPlatformButtons(),loadNotifCenter(),loadDragonControls()]);
                try{
                    const {data:messages,error}=await sb.rpc('midad_get_my_admin_messages');
                    if(!error && Array.isArray(messages)) state.pendingUserMessages=messages;
                }catch(_){}
                ivWriteAppCache(state.user.id);
                render();
                showToast('تمت مزامنة البيانات بعد عودة الإنترنت.','success');
            }finally{ ivOnlineRefreshRunning=false; }
        }
        window.addEventListener('online',()=>{ void ivRefreshAfterReconnect(); });
        let explicitLogout=false;
        sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'&&explicitLogout)location.replace('../index.html');});



        console.log('المنصة · V12');
        console.log('👤 العضو:', state.user.name);
        console.log('📂 الأقسام:', state.sections.length);
    </script>

if (!window.__midadDragonThemeObserver) {
  window.__midadDragonThemeObserver = new MutationObserver(() => {
    const frame = document.querySelector('.welcome-dragon-frame');
    if (!frame) return;

      primary: styles.getPropertyValue('--primary').trim() || '#2563eb',

      accent: styles.getPropertyValue('--gold').trim() || '#22d3c5',
      bg: styles.getPropertyValue('--bg').trim() || '#f8fafc'
    }).toString();
    const next = 'interactive-dragon.html?' + params;
    if (!frame.src.endsWith(next)) frame.src = next;
  });
  window.__midadDragonThemeObserver.observe(document.documentElement,{attributes:true,attributeFilter:['data-midad-theme']});
}

<script>
(function ivNativeIntegration(){
    // Everything here is best-effort: on the plain web site (no Capacitor)
    // window.Capacitor is undefined and this whole block silently does nothing.
    function whenBooted(fn, tries){
        tries = tries || 0;
        if(typeof openModal==='function' && typeof loadNotifCenterList==='function'){ fn(); return; }
        if(tries > 100) return; // ~10s, give up quietly
        setTimeout(function(){ whenBooted(fn, tries+1); }, 100);
    }

    function openNotifCenterNow(){
        whenBooted(async function(){
            try{ await loadNotifCenterList(); state.notifCenterExpandedId=null; openModal('notif-center', {}); }
            catch(e){ console.warn('open notif center failed', e); }
        });
    }

    // Deep link from a system notification tap (?openNotifCenter=1) or from
    // the service worker's notificationclick handler on the web build.
    try{
        const params = new URLSearchParams(location.search);
        if(params.get('openNotifCenter')==='1') openNotifCenterNow();
    }catch(_){}

    if(!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;

    // ── Hardware back button ──────────────────────────────────────────
    // Goal: pressing back never re-shows the blue login/loading screen
    // (index.html). Inside the app it closes whatever modal is open;
    // at the app's home screen it exits the app instead of navigating
    // backward into the login gate.
    try{
        const { App } = window.Capacitor.Plugins || {};
        if(App && App.addListener){
            let lastBackAt=0;
            App.addListener('backButton', function(){
                try{
                    if(typeof closeModal==='function' && typeof state!=='undefined' && state.modal){
                        closeModal();
                        return;
                    }
                    if(typeof closeConfirm==='function' && typeof state!=='undefined' && state.confirm){
                        closeConfirm();
                        return;
                    }
                }catch(_){}
                try{
                    if(nativeNavigateBack()) return;
                }catch(_){}

                // Root screen: require a second Back within a short window before exit.
                const now=Date.now();
                if(now-lastBackAt<2200){
                    if(App.exitApp) App.exitApp();
                    else if(App.minimizeApp) App.minimizeApp();
                    return;
                }
                lastBackAt=now;
                showToast('اضغط مرة أخرى للخروج من التطبيق','info');
            });
        }
    }catch(e){ console.warn('back button wiring failed', e); }

    // Native Android push notifications are intentionally disabled.
    // The in-app Notification Center continues to use the existing Supabase data.
})();
</script>
