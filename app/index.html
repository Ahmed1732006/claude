<style id="access-message-style">
.access-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 0%,#eef5ff 0%,#f7f9fc 42%,#eef1f6 100%);font-family:'Cairo',sans-serif;color:#172033}

.platform-button-place-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

        // Native-style SPA navigation history. Each route stores the section/subsection
        // context, so Android Back can move exactly one screen at a time instead of
        // jumping out of the app.
        function navEntry(view, opts = {}) {
            return {
                view,
                sectionId: opts.sectionId !== undefined ? opts.sectionId : state.currentSectionId,
                subId: opts.subId !== undefined ? opts.subId : state.currentSubId
            };
        }
        function navSame(a,b){
            return !!a && !!b && a.view===b.view && String(a.sectionId||'')===String(b.sectionId||'') && String(a.subId||'')===String(b.subId||'');
        }
        function resetNavigation(view='home', opts={}) {
            state.navStack=[navEntry(view,opts)];
            state.view=view;
            if (opts.sectionId !== undefined) state.currentSectionId=opts.sectionId;
            if (opts.subId !== undefined) state.currentSubId=opts.subId;
        }
        function go(view, opts = {}) {
            const next=navEntry(view,opts);
            const current=state.navStack[state.navStack.length-1];
            if(!navSame(current,next)) state.navStack.push(next);
            state.view = view;
            if (opts.sectionId !== undefined) state.currentSectionId = opts.sectionId;
            if (opts.subId !== undefined) state.currentSubId = opts.subId;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        function nativeNavigateBack() {
            if(state.navStack.length>1){
                state.navStack.pop();
                const prev=state.navStack[state.navStack.length-1];
                state.view=prev.view;
                state.currentSectionId=prev.sectionId||null;
                state.currentSubId=prev.subId||null;
                render();
                window.scrollTo({top:0,behavior:'smooth'});
                return true;
            }
            return false;
        }

        function publicStorageUrl(bucket, path) {
            if (!path) return null;
            if (/^https?:\/\//i.test(path) || /^data:/i.test(path)) return path;
            const { data } = sb.storage.from(bucket).getPublicUrl(path);
            return data?.publicUrl || path;
        }

        const IV_APP_CACHE_KEY='in-the-void-app-cache-v3';
        function ivReadAppCache(userId){
            try{
                const raw=localStorage.getItem(`${IV_APP_CACHE_KEY}:${String(userId||'')}`);
                if(!raw) return null;
                const parsed=JSON.parse(raw);
                return parsed && typeof parsed==='object' ? parsed : null;
            }catch(_){ return null; }
        }
        function ivWriteAppCache(userId){
            if(!userId) return;
            try{
                const payload={
                    savedAt:Date.now(),
                    user:state.user,
                    role:state.role,
                    sections:state.sections,
                    platformManager:state.platformManager,
                    platformButtons:state.platformButtons,
                    notifCenterSettings:state.notifCenterSettings,
                    notifCenterList:state.notifCenterList,
                    pendingUserMessages:state.pendingUserMessages,
                    dragonControls:state.dragonControls
                };
                localStorage.setItem(`${IV_APP_CACHE_KEY}:${String(userId)}`,JSON.stringify(payload));
            }catch(e){ console.warn('offline app cache write failed',e); }
        }
        function ivRestoreAppCache(userId){
            const c=ivReadAppCache(userId);
            if(!c) return false;
            try{
                if(Array.isArray(c.sections)) state.sections=c.sections;
                if(c.user) state.user={...state.user,...c.user};
                if(c.role) state.role=c.role;
                if(c.platformManager) state.platformManager=c.platformManager;
                if(Array.isArray(c.platformButtons)) state.platformButtons=c.platformButtons;
                if(c.notifCenterSettings) state.notifCenterSettings=c.notifCenterSettings;
                if(Array.isArray(c.notifCenterList)) state.notifCenterList=c.notifCenterList;
                if(Array.isArray(c.pendingUserMessages)) state.pendingUserMessages=c.pendingUserMessages;
                if(c.dragonControls) state.dragonControls=c.dragonControls;
                state.notifCenterLoaded=Array.isArray(c.notifCenterList);
                return true;
            }catch(e){ console.warn('offline app cache restore failed',e); return false; }
        }
        function isOfflineFailure(err){
            if(typeof navigator!=='undefined' && navigator.onLine===false) return true;
            const msg=String(err?.message||err||'').toLowerCase();
            return /network|fetch|failed to fetch|load failed|networkerror|timeout|offline|err_internet_disconnected|connection/.test(msg);
        }

        function safeFileName(name){
            return String(name||'file').replace(/[^\w.\-\u0600-\u06FF ]+/g,'_').replace(/\s+/g,'_').slice(0,120);

        async function uploadFile(bucket,file,folder='uploads'){
            if(!file) return null;
            if(!(file instanceof File)) throw new Error('ملف الرفع غير صالح.');
            // Keep Storage object keys ASCII-only; Unicode filenames can be rejected
            // by Supabase Storage as an invalid key.
            const originalName=String(file.name||'file');
            const ext=(originalName.match(/\.([A-Za-z0-9]{1,12})$/)||[])[1]||'bin';
            const cleanFolder=String(folder||'uploads').replace(/[^A-Za-z0-9._-]/g,'_');
            const path=`${cleanFolder}/${crypto.randomUUID()}.${ext.toLowerCase()}`;
            const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,cacheControl:'3600',contentType:file.type||'application/octet-stream'});
            if(error) throw new Error(`فشل رفع الملف إلى Storage: ${error.message}`);
            return path;
        }

        async function uploadImageIfNeeded(dataUrlOrUrl,bucket,folder,name='image.png',fileObj=null){
            if(fileObj) return uploadFile(bucket,fileObj,folder);
            return dataUrlOrUrl||null;

        async function downloadMaterial(item) {
            const path = item?.filePath || item?.fileData;
            if (!path) return showToast('لا يوجد ملف لهذه المادة', 'error');
            if (/^https?:\/\//i.test(path)) {
                window.open(path, '_blank', 'noopener');
                return;
            }
            try {
                const { data, error } = await sb.storage.from('materials').createSignedUrl(path, 300);
                if (error) throw error;
                window.open(data.signedUrl, '_blank', 'noopener');
            } catch (e) {
                showToast(e.message || 'تعذّر تحميل الملف', 'error');
            }
        }

        function downloadFile(data, name) {
            if (!data) return;
            const link = document.createElement('a');
            link.href = data;
            link.download = name || 'download';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => {
                el.classList.remove('show');
            }, 3000);
        }

        function render() {
            const app = document.getElementById('app');

            // Exposed so other scripts (theme-system.js) can react to the
            // current page without needing access to this script's own
            // closure-scoped `state` (which it can't reach — it has its own
            // unrelated local `state` object).
            window.__midadCurrentView = state.view;

                app.innerHTML = renderLogin();

            }

            if (state.modal) app.innerHTML += renderModal();
            if (state.confirm) app.innerHTML += renderConfirm();
            if (isRealAdmin() && state.viewAsMember) app.innerHTML += renderViewAsMemberBanner();

            attachEvents();

        async function loadDragonControls(){
            try{
                const device = window.matchMedia('(max-width: 759px)').matches ? 'mobile' : 'desktop';
                const {data,error}=await sb.rpc('dragon_get_my_controls',{p_device:device});
                if(error) throw error;
                const row=Array.isArray(data)?data[0]:data;
                if(row){
                    const device=String(row.device_mode||'both');
                    const mobile=window.matchMedia('(max-width: 759px)').matches;
                    const allowedDevice=device==='both' || (mobile && device==='mobile') || (!mobile && device==='desktop');
                    state.dragonControls={
                        show:Boolean(row.show_dragon) && allowedDevice,
                        controlAvailable:Boolean(row.control_available),
                        userEnabled:Boolean(row.user_enabled),
                        deviceMode:device,
                        isAdmin:Boolean(row.is_admin)
                    };
                }
            }catch(e){
                console.warn('dragon controls unavailable',e);
            }
        }

        async function toggleMyDragonEnabled(){
            if(!state.dragonControls?.controlAvailable) return;
            const next=!state.dragonControls.userEnabled;
            try{
                const {error}=await sb.rpc('dragon_set_my_enabled',{p_enabled:next});
                if(error) throw error;
                state.dragonControls.userEnabled=next;
                state.dragonControls.show=next;
                render();
                showToast(next?'تم إظهار التنين عندك 🐉':'تم إخفاء التنين عندك','success');
            }catch(e){ showToast(e.message||'تعذر تغيير إعداد التنين','error'); }
        }

        // ─── Admin: User Management (inside 2.html) ───

        function escapeHtml(value){
            return String(value ?? '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        const PROFILE_TITLE_PRESETS = [
            'قمر','نجمة','وردة','ميوش','ميموية','صحبي','صحبتي','صديقي','صديقتي','أمير','ملكة',
            'نجم','كوكب','لؤلؤة','فراشة','سكر','عسل','برنس','برنسيسة','شطور','جدع','باشا','باشمهندس',
            'فنان','فنانة','مبدع','مبدعة','أسطورة','روح حلوة','الجامد','الجامدة','الرايق','الرايقة',
            'الكابتن','الزعيم','الملكة','الأمير','نجم اليوم','صاحبنا','صاحبتنا','رفيق','رفيقة','غالي','غالية'
        ];
        function titleList(value){
            if(Array.isArray(value)) return value.map(v=>String(v).trim()).filter(Boolean);
            return String(value||'').split(/[,،|]/).map(v=>v.trim()).filter(Boolean);
        }
        function visibleTitleList(u){
            // The subset of a user's titles that shows "up top" (header, next
            // to their name). Inside the profile page and inside the welcome
            // greeting, ALL of profile_title always show regardless of this.
            // visible_titles === null/undefined means "never customized yet"
            // → show everything (keeps old behaviour until someone picks).
            const all=titleList(u?.profile_title);
            if(u?.visible_titles==null) return all;
            const chosen=new Set(titleList(u.visible_titles));
            return all.filter(t=>chosen.has(t));
        }
        function renderVisibleTitlePicker(u, opts={}){
            const all=titleList(u?.profile_title);
            if(!all.length) return `<p class="access-help" style="margin-top:6px">لسه معندكش ألقاب مضافة، اختار لقب أو أكتر الأول.</p>`;
            const visible=new Set(visibleTitleList(u));
            const prefix=opts.idPrefix||'vt';
            return `<div class="title-picker" id="${prefix}-picker" data-user-id="${escapeHtml(u.id||'')}">
                <div class="title-picker-grid">${all.map(t=>`<button type="button" class="title-option ${visible.has(t)?'active':''}" data-act="visible-title-toggle" data-visible-title="${escapeHtml(t)}">✦ ${escapeHtml(t)}</button>`).join('')}</div>
                <small style="display:block;margin-top:7px;color:var(--text-muted)">اللي مفعّل هنا هو اللي هيظهر فوق جنب الاسم. جوه الملف الشخصي وفي رسالة الترحيب هتفضل كل الألقاب ظاهرة زي ما هي.</small>
            </div>`;
        }
        function renderTitleChips(value, cls='title-chips'){
            const arr=titleList(value);
            return arr.length ? `<div class="${cls}">${arr.map(t=>`<span class="title-chip">✦ ${escapeHtml(t)}</span>`).join('')}</div>` : '';
        }
        function renderTitlePicker(value){
            const selected=titleList(value);
            return `<div class="title-picker">
                <div class="title-picker-grid">${PROFILE_TITLE_PRESETS.map(t=>`<button type="button" class="title-option ${selected.includes(t)?'active':''}" data-act="title-option" data-title-option="${escapeHtml(t)}">✦ ${escapeHtml(t)}</button>`).join('')}</div>
                <div class="field" style="margin-top:10px;margin-bottom:0"><label>لقب إضافي من عندك</label><div style="display:flex;gap:8px"><input id="um-custom-title" type="text" placeholder="مثال: قمر 007 أو صاحب المذاكرة..." value=""><button type="button" class="btn-save" style="min-width:90px" data-act="title-add-custom">إضافة</button></div></div>
                <div id="um-selected-titles" class="title-selected">${selected.map(t=>`<button type="button" class="title-remove" data-act="title-remove" data-title-remove="${escapeHtml(t)}">✕ ${escapeHtml(t)}</button>`).join('')}</div>
                <input type="hidden" id="um-edit-title" value="${escapeHtml(selected.join('، '))}">
                <small style="display:block;margin-top:7px;color:var(--text-muted)">اختار لقب أو أكتر؛ هتظهر الألقاب جنب بعض. وتقدر تضيف لقب من اختيارك.</small>
            </div>`;
        }
        function syncSelectedTitles(){
            const hidden=document.getElementById('um-edit-title');
            const box=document.getElementById('um-selected-titles');
            if(!hidden||!box) return [];
            const arr=[...box.querySelectorAll('[data-title-remove]')].map(b=>b.getAttribute('data-title-remove')).filter(Boolean);
            hidden.value=arr.join('، ');
            return arr;
        }
        function userDisplayName(u){
            const n=(u?.full_name||u?.name||'').trim();
            return n || 'الاسم غير مسجل';
        }

        function userDisplayPhone(u){
            const p=(u?.phone_number||u?.phone||'').trim();
            return p || 'التليفون غير مسجل';
        }

        function userStatus(u){
            if(u?.role==='admin'||u?.role==='super_admin') return {key:'admin',label:'أدمن ذهبي',tone:'violet'};
            if(u?.role==='moderator') return {key:'moderator',label:'مشرف',tone:'blue'};
            if(u?.status==='revoked') return {key:'revoked',label:'مرفوض / موقوف',tone:'red'};
            if(u?.status==='pending') return {key:'pending',label:'في انتظار الموافقة',tone:'amber'};
            if(u?.account_type==='temporary'||u?.is_temporary===true||u?.must_change_credentials===true)
                return {key:'temporary',label:'حساب مؤقت',tone:'blue'};
            return {key:'approved',label:'عضو مقبول',tone:'green'};
        }

        function latestRequestForUser(userId){
            const arr=(state.userRequests||[]).filter(r=>String(r.user_id)===String(userId));
            return arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0] || null;
        }

        function requestLabel(req){
            if(!req) return '';
            if(req.request_type==='new_account') return 'طلب إنشاء حساب';
            if(req.request_type==='temporary_completion') return 'إكمال حساب مؤقت';
            if(req.request_type==='revoked_reapply') return 'طلب موافقة جديد';
            return 'طلب حساب';
        }

        async function openUsersManagement(){
            if(!isAdmin()) { showToast('غير مصرح به','error'); return; }
            go('users');
            state.usersLoading=true;
            render();
            try{
                const [profilesRes, requestsRes, messagesRes] = await Promise.all([
                    sb.from('profiles').select('*').order('created_at',{ascending:false}),
                    sb.from('account_requests').select('*').order('created_at',{ascending:false}),
                    sb.from('user_messages').select('*').order('created_at',{ascending:false}).limit(20)
                ]);
                if(profilesRes.error) throw profilesRes.error;
                if(requestsRes.error) throw requestsRes.error;
                if(messagesRes.error) throw messagesRes.error;
                state.users=profilesRes.data||[];
                state.userRequests=requestsRes.data||[];
                state.adminMessages=messagesRes.data||[];
                await loadWelcomeVideoLibrary();
                await Promise.all([loadWelcomeVideoRecipientsStatus(), loadWelcomeVideoExcluded()]);
                try{
                    const currentUserId = state.user?.id;
                    if(!currentUserId) throw new Error('انتهت جلسة الدخول.');
                    const {data:hidden}=await sb.from('admin_message_hidden').select('message_id').eq('user_id',currentUserId);
                    const hiddenIds=new Set((hidden||[]).map(x=>String(x.message_id)));
                    state.adminMessages=state.adminMessages.filter(m=>!hiddenIds.has(String(m.id)));
                }catch(_){}
            }catch(err){
                console.error(err);
                showToast(`تعذر تحميل المستخدمين: ${err.message||'خطأ غير معروف'}`,'error');
            }finally{
                state.usersLoading=false;
                render();
            }
        }

        function filteredUsers(){
            const q=(state.usersSearch||'').trim().toLowerCase();
            return (state.users||[]).filter(u=>{
                const st=userStatus(u).key;
                const matchFilter=state.usersFilter==='all'||st===state.usersFilter;
                const hay=[
                    u.full_name,u.name,u.email,u.phone,u.phone_number,u.role,u.status,u.account_type
                ].filter(Boolean).join(' ').toLowerCase();
                return matchFilter && (!q||hay.includes(q));
            });
        }

            const users=filteredUsers();
            const all=state.users||[];
            const wvStatusRow=(u,label)=>{
                const nm=userDisplayName(u); const initial=(nm.trim()[0]||'؟').toUpperCase();
                return `<div class="wv-status-row"><span class="user-picker-avatar">${escapeHtml(initial)}</span><span>${escapeHtml(nm)}</span><small>${escapeHtml(label)}</small>${label==='في الانتظار'?`<button type="button" class="wv-status-remove" data-act="exclude-welcome-video-user" data-user-id="${escapeHtml(u.id)}" title="استبعاد هذا العضو" aria-label="استبعاد ${escapeHtml(nm)}">×</button>`:''}</div>`;
            };
            const wvStatusRows=(state.welcomeVideoRecipientsStatus||[]);
            const wvExcludedIds=new Set(state.welcomeVideoExcluded||[]);
            const wvPendingUsers=wvStatusRows.filter(r=>!r.viewed_at && !wvExcludedIds.has(String(r.user_id))).map(r=>all.find(u=>String(u.id)===String(r.user_id))).filter(Boolean);
            const wvViewedUsers=wvStatusRows.filter(r=>!!r.viewed_at).map(r=>({u:all.find(u=>String(u.id)===String(r.user_id)),at:r.viewed_at})).filter(x=>x.u);
            const wvExcludedUsers=all.filter(u=>wvExcludedIds.has(String(u.id)));
            const counts={
                all:all.length,
                approved:all.filter(u=>userStatus(u).key==='approved').length,
                pending:all.filter(u=>userStatus(u).key==='pending').length,
                temporary:all.filter(u=>userStatus(u).key==='temporary').length,
                revoked:all.filter(u=>userStatus(u).key==='revoked').length
            };
            const cards=users.map(u=>{
                const st=userStatus(u);
                const req=latestRequestForUser(u.id);
                const initials=(userDisplayName(u).replace('الاسم غير مسجل','؟').trim().charAt(0)||'؟').toUpperCase();
                const avatar=publicStorageUrl('avatars',u.avatar_path||u.avatar_url);
                const avatarHtml=avatar?`<img src="${escapeHtml(avatar)}" alt="">`:escapeHtml(initials);

                        <div class="um-meta"><span>${escapeHtml(userDisplayPhone(u))}</span><span>•</span><span>${escapeHtml(date)}</span></div>
                      </div>
                      <span class="um-status ${st.tone}">${escapeHtml(st.label)}</span>
                    </div>
                    ${req ? `<div class="um-request-line"><i class="fas fa-file-signature"></i><span>${escapeHtml(requestLabel(req))}</span>${req.note?`<span class="um-note">— ${escapeHtml(req.note)}</span>`:''}</div>`:''}
                    <div class="um-card-actions">
                      <button data-act="user-details" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-eye"></i> التفاصيل</button>
                      ${st.key==='pending' ? `<button class="success" data-act="user-approve" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-check"></i> قبول</button>`:''}
                      ${st.key!=='admin' && st.key!=='revoked' ? `<button data-act="user-revoke" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-ban"></i> رفض / إيقاف</button>`:''}
                      ${st.key==='revoked' ? `<button class="success" data-act="user-approve" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-rotate-left"></i> إعادة تفعيل</button>`:''}
                      ${st.key==='approved' ? `<button data-act="user-reapply" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-user-clock"></i> طلب إذن من جديد</button><button data-act="user-force-password" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-key"></i> تغيير كلمة السر عند الدخول</button>`:''}
                      ${st.key!=='admin' ? `<button class="welcome-user-action" data-act="user-welcome" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-hand-sparkles"></i> ترحيب أول مرة</button>`:''}${st.key!=='admin' ? `<button data-act="user-edit" data-user-id="${escapeHtml(u.id)}"><i class="fas fa-user-pen"></i> تعديل</button>`:''}

            return `

              </div>

              ${state.usersLoading
                  ? `<div class="um-empty"><i class="fas fa-spinner fa-spin"></i><h3>جاري تحميل الحسابات…</h3></div>`
                  : users.length
                    ? `<div class="um-list">${cards}</div>`

              <div class="message-compose-card">

                  </div>
                </div>
                ${state.adminMessages?.length ? `<div class="message-list">${state.adminMessages.slice(0,8).map(msg=>{
                    const target=msg.target_user_id ? state.users.find(x=>String(x.id)===String(msg.target_user_id)) : null;

                    return `<div class="message-list-item"><div class="message-list-item-main"><strong>${escapeHtml(msg.title||'رسالة من الإدارة')}</strong><small>${escapeHtml((msg.body||'').slice(0,180))}</small><small>تظهر: ${escapeHtml(views)}</small></div><div class="message-list-actions"><span class="message-audience">${target?escapeHtml(userDisplayName(target)):'كل الحسابات'}</span><button class="message-action-btn" data-act="hide-admin-message" data-message-id="${escapeHtml(msg.id)}">إخفاء عندي</button><button class="message-action-btn danger" data-act="delete-admin-message" data-message-id="${escapeHtml(msg.id)}">${target?'حذف الرسالة':'حذف عن الكل'}</button></div></div>`;
                }).join('')}</div>` : `<div class="um-footer-note"><i class="fas fa-inbox"></i> لا توجد رسائل مرسلة حتى الآن.</div>`}
              </div>


              <div class="welcome-video-admin-card">
                <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
                  <div>
                    <h3><i class="fas fa-film" style="color:var(--primary)"></i> فيديو الترحيب الأول</h3>
                    <p>يتعرض للمستخدم مرة واحدة فقط حسب الإعداد. لا يوجد فيديو تلقائي داخل الموقع؛ ارفع فيديو من هنا وحدد مين يشوفه، أو رجّع ظهوره من جديد.</p>
                  </div>
                  <div class="welcome-video-status">
                    <span>${state.welcomeVideoCampaign?.is_active===false?'متوقف':'مفعّل'}</span>
                    <span>${state.welcomeVideoCampaign?.audience_mode==='selected'?'أشخاص محددون':'كل الحسابات'}</span>
                    <span>${state.welcomeVideoCampaign?.video_path?'فيديو مخصص من الأدمن':'لا يوجد فيديو محدد'}</span>
                  </div>
                </div>
                <div class="welcome-video-admin-grid">
                  <div class="field">
                    <label>إظهار الفيديو لـ</label>
                    <select id="welcome-video-audience">
                      <option value="all" ${state.welcomeVideoCampaign?.audience_mode!=='selected'?'selected':''}>كل الحسابات</option>
                      <option value="selected" ${state.welcomeVideoCampaign?.audience_mode==='selected'?'selected':''}>أشخاص أختارهم</option>
                    </select>
                  </div>
                  <div class="field">
                    <label>حالة الفيديو</label>
                    <select id="welcome-video-active">
                      <option value="true" ${state.welcomeVideoCampaign?.is_active!==false?'selected':''}>مفعّل</option>

                    </select>
                  </div>
                </div>
                <div class="welcome-video-recipients ${state.welcomeVideoCampaign?.audience_mode==='selected'?'show':''}" id="welcome-video-recipients-box">
                  <div class="field"><label>اختار الحسابات</label>
                    <select id="welcome-video-recipient-select" multiple size="7" class="access-multi">
                      ${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${(state.welcomeVideoCampaign?.recipient_ids||[]).includes(u.id)?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}
                    </select>
                    <small class="access-help">دور بالاسم أو الإيميل، أو استخدم "تحديد الكل".</small>
                  </div>
                </div>
                ${state.welcomeVideoCampaign?.audience_mode==='selected' ? `<div class="welcome-video-status-lists">
                  <div class="wv-status-col">

                    <div class="wv-status-list">${wvPendingUsers.length? wvPendingUsers.map(u=>wvStatusRow(u,'في الانتظار')).join('') : '<div class="wv-status-empty">لا يوجد أحد في الانتظار.</div>'}</div>
                  </div>
                  <div class="wv-status-col">
                    <h4><i class="fas fa-circle-check"></i> شافوا بالفعل <span>${wvViewedUsers.length}</span></h4>
                    <div class="wv-status-list">${wvViewedUsers.length? wvViewedUsers.map(x=>wvStatusRow(x.u,new Date(x.at).toLocaleDateString('ar-EG'))).join('') : '<div class="wv-status-empty">محدش شاف الفيديو لسه.</div>'}</div>
                  </div>
                </div>` : ''}
                <div class="welcome-video-excluded-box">
                  <h3><i class="fas fa-user-slash" style="color:var(--danger,#c6493f)"></i> مستبعدون من رؤية الفيديو</h3>
                  <p>الأشخاص هنا مش هيشوفوا فيديو الترحيب أبدًا، حتى لو كان متاحًا لكل الحسابات أو محددًا لهم.</p>
                  <div class="field">
                    <select id="welcome-video-excluded-select" multiple size="6" class="access-multi">
                      ${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${wvExcludedIds.has(String(u.id))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}
                    </select>
                  </div>
                  <div class="welcome-video-admin-controls">

                <div class="welcome-video-library-modern">
                  <div class="welcome-video-library-modern-head">
                    <div>
                      <h4><i class="fas fa-film"></i> مكتبة فيديوهات الترحيب</h4>
                      <p>كل فيديو يظهر باسمه الأصلي. استخدم «اختيار» لتحديد الفيديو الذي سيعمل للأعضاء، و«معاينة» لمشاهدته.</p>

                          </div>
                        </div>

                      <i class="fas fa-film"></i><strong>مكتبة الفيديوهات فاضية</strong><span>اختار فيديو من زر الرفع بالأسفل، وبعدها اضغط «حفظ إعدادات الفيديو» ليتم إضافته للقائمة.</span>

                </div>
                <div class="welcome-video-library-grid" style="display:none!important">
                  <div class="field">
                    <select id="welcome-video-library-select">
                      <option value="">لا تغيير</option>

                    </select>

<div class="field" style="margin-top:12px">

        function renderModal() {

            if (!m) return '';


            if (m.kind === 'manager-news-view') {
                const item=m.item||{};
                return `

                  </div>
                </div>`;
            }

            if (m.kind === 'welcome-video-preview') {
                const path=m.path||'';
                const url=publicStorageUrl('welcome-videos',path);
                return `

                      <div class="modal-actions"><button class="btn-cancel" data-act="close-modal">إلغاء</button><button class="btn-save" data-act="save-platform-manager">حفظ للجميع</button></div>
                    </div>`;
                }
                return `<div class="modal um-modal manager-modal" data-stop="1">
                  <div class="modal-head"><h3><i class="fas fa-crown" style="color:#d89b00"></i> ${escapeHtml(pm.name||'مدير المنصة')}</h3><button class="modal-close" data-act="close-modal">×</button></div>
                  <div class="manager-hero"><div class="manager-avatar-lg">${avatar}</div><div><span class="manager-public-badge"><i class="fas fa-shield-alt"></i> ملف عام للمنصة</span><div class="manager-title-list">${titles.map(t=>`<span class="manager-title-chip">✦ ${escapeHtml(t)}</span>`).join('')}</div></div></div>
                  <div class="manager-public-note">${escapeHtml(pm.message||'أهلًا بيكم في المنصة ✨')}</div><div style="margin-top:12px">${renderPlatformButtons('manager')}</div>
                  <div class="modal-actions"><button class="btn-save" data-act="close-modal">إغلاق</button></div>
                </div>`;
            }

            if (m.kind === 'profile') {
                const hasAvatar = m.avatar && m.avatar.length > 0;
                return `
              <div class="overlay" data-act="close-modal-overlay">
                <div class="modal" data-stop="1">
                  <h3><i class="fas fa-user-edit"></i> تعديل الملف الشخصي</h3>
                  <div class="field">
                    <label>الصورة الرمزية</label>
                    <div class="file-pick">
                      <div class="prev ${hasAvatar ? 'has-image' : ''}" style="${hasAvatar ? `background-image:url(${m.avatar})` : ''}">${!hasAvatar ? '📷' : ''}</div>
                      <label class="upl">اختر صورة<input type="file" id="modal-avatar" accept="image/*"></label>
                      <span class="fname">${hasAvatar ? 'تم اختيار صورة' : 'لا توجد صورة'}</span>
                    </div>
                  </div>
                  <div class="field">
                    <label>الاسم</label>
                    <input type="text" id="modal-name" value="${(m.name||'').replace(/"/g,'&quot;')}" />
                  </div>
                  <div class="field">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="modal-email" value="${(m.email||'').replace(/"/g,'&quot;')}" disabled />
                  </div>
                  <div class="modal-actions">
                    <button class="btn-save" data-act="save-profile">حفظ</button>
                    <button class="btn-cancel" data-act="close-modal">إلغاء</button>
                  </div>
                </div>
              </div>`;
            }

            if (m.kind === 'notif-center') {
                const list = state.notifCenterList || [];
                const renderMedia = (n) => {
                    if (!n.media_path) return '';
                    const url = notifCenterMediaUrl(n.media_path);
                    if (!url) return '';
                    return n.media_type === 'video'
                        ? `<button type="button" class="notif-media-box" data-act="open-notif-media" data-media-type="video" data-media-url="${escapeHtml(url)}"><video class="notif-media-preview" muted playsinline preload="metadata" src="${escapeHtml(url)}" onloadedmetadata="this.currentTime=0.05" onerror="this.closest('.notif-media-box').innerHTML='<span class=\'notif-media-error\'><i class=\'fas fa-triangle-exclamation\'></i> تعذّر تحميل الفيديو</span>'"></video><span class="notif-media-hint"><i class="fas fa-play"></i> اضغط لتشغيل الفيديو</span></button>`
                        : `<button type="button" class="notif-media-box" data-act="open-notif-media" data-media-type="image" data-media-url="${escapeHtml(url)}"><img class="notif-media-preview" src="${escapeHtml(url)}" alt="مرفق" onerror="this.closest('.notif-media-box').innerHTML='<span class=\'notif-media-error\'><i class=\'fas fa-triangle-exclamation\'></i> تعذّر تحميل الصورة</span>'"></button>`;
                };
                const items = list.map(n => {
                    const expanded = state.notifCenterExpandedId === n.id;
                    return `<div class="notif-item">
                        <div class="notif-item-head" data-act="notif-item-toggle" data-notif-id="${escapeHtml(n.id)}">
                          ${!n.open_count ? '<i class="fas fa-circle"></i>' : ''}
                          <span class="notif-item-title-wrap"><span class="notif-item-title">${escapeHtml(n.title||'إشعار')}</span></span>
                          <i class="fas ${expanded?'fa-chevron-up':'fa-chevron-down'}" style="color:var(--text-muted,#94a3b8);font-size:.75rem"></i>
                          <button type="button" class="notif-item-del" data-act="notif-item-delete" data-notif-id="${escapeHtml(n.id)}" title="حذف عندي" onclick="event.stopPropagation()"><i class="fas fa-trash"></i></button>
                        </div>
                        ${expanded ? `<div class="notif-item-body">
                          ${n.body ? `<div>${escapeHtml(n.body).replace(/\n/g,'<br>')}</div>` : ''}
                          ${renderMedia(n)}
                        </div>` : ''}
                    </div>`;
                }).join('');
                return `<div class="notif-center-overlay" data-act="close-modal-overlay">
                  <div class="notif-center-panel" data-stop="1">
                    <div class="notif-center-head"><h3><i class="fas fa-bell"></i> الإشعارات</h3><button type="button" class="notif-center-close" data-act="close-modal">×</button></div>
                    <div class="notif-center-note"><i class="fas fa-circle-info"></i> ملاحظة: الإشعار هيتمسح بعد ما تفتحه تاني، أو تلقائيًا خلال 24 ساعة من أول فتح.</div>
                    ${list.length ? items : `<div class="notif-center-empty"><i class="fas fa-bell-slash"></i>مفيش إشعارات جديدة دلوقتي</div>`}
                  </div>
                </div>`;
            }

            if (m.kind === 'notif-media') {
                const type = String(m.mediaType||'image');

                    ? `<video class="notif-media-full" controls autoplay playsinline src="${escapeHtml(url)}"></video>`

                return `<div class="notif-media-overlay" data-act="close-modal-overlay">
                  <div class="notif-media-viewer" data-stop="1">
                    <button type="button" class="notif-media-close" data-act="close-modal" aria-label="إغلاق">×</button>

            if (m.kind === 'notif-receipts') {

                const body = m.loading

                    : m.error
                        ? `<div class="notif-receipts-empty"><i class="fas fa-triangle-exclamation"></i> ${escapeHtml(m.error)}</div>`
                        : rows.length
                            ? rows.map(r=>`<div class="notif-receipt-row">
                                <div class="notif-receipt-info">
                                  <strong>${escapeHtml(r.name||'بدون اسم')}</strong>
                                  <small>${escapeHtml(r.email||'')}</small>
                                  <small><i class="fas fa-clock"></i> ${r.opened_at ? new Date(r.opened_at).toLocaleString('ar-EG') : '—'}${r.open_count?` · اتفتح ${r.open_count} ${r.open_count===1?'مرة':'مرات'}`:''}</small>
                                </div>
                                <button type="button" class="notif-receipt-clear" data-act="notif-receipts-clear-one" data-notif-id="${escapeHtml(m.notifId)}" data-user-id="${escapeHtml(r.user_id)}" title="امسح هذه المعلومة"><i class="fas fa-eraser"></i></button>
                              </div>`).join('')
                            : `<div class="notif-receipts-empty"><i class="fas fa-eye-slash"></i> محدش فتح الإشعار ده لسه.</div>`;
                return `<div class="overlay" data-act="close-modal-overlay">
                  <div class="modal notif-receipts-modal" data-stop="1">
                    <div class="modal-head">
                      <h3><i class="fas fa-users-viewfinder"></i> مين شاف الإشعار</h3>
                      <button class="modal-close" data-act="close-modal">×</button>

                    <p class="access-help" style="margin:-6px 0 12px">المعلومة دي بتتمسح تلقائيًا بعد أسبوع من فتح الشخص للإشعار.</p>

            // Password modal
            if (m.kind === 'password') {
                return `
              <div class="overlay" data-act="close-modal-overlay">
                <div class="modal" data-stop="1">
                  <h3><i class="fas fa-key"></i> تغيير كلمة السر</h3>
                  <div class="field">
                    <label>كلمة السر الحالية</label>
                    <input type="password" id="old-pass" />
                  </div>
                  <div class="field">
                    <label>كلمة السر الجديدة</label>
                    <input type="password" id="new-pass" />
                  </div>
                  <div class="field">
                    <label>تأكيد كلمة السر الجديدة</label>
                    <input type="password" id="confirm-pass" />
                  </div>
                  <div class="modal-actions">
                    <button class="btn-save" data-act="save-pass">تغيير</button>
                    <button class="btn-cancel" data-act="close-modal">إلغاء</button>
                  </div>
                </div>
              </div>`;
            }

            // Section / Sub / Item modals (admin only)
            const titles = {
                section: 'تعديل القسم',
                sub: 'تعديل القسم الفرعي',
                item: 'تعديل المستطيل',
                'add-section': 'قسم جديد',
                'add-sub': 'قسم فرعي جديد',
                'add-item': 'مستطيل جديد'
            };
            const isItem = m.kind === 'item' || m.kind === 'add-item';
            const showDelete = m.kind === 'section' || m.kind === 'item' || m.kind === 'sub';
            const hasImage = m.image && m.image.length > 0;
            const hasFile = m.fileData && m.fileData.length > 0;

            return `
            <div class="overlay" data-act="close-modal-overlay">
              <div class="modal" data-stop="1">
                <h3><i class="fas ${m.kind === 'section' || m.kind === 'add-section' ? 'fa-folder' : m.kind === 'sub' || m.kind === 'add-sub' ? 'fa-folder-open' : 'fa-file'}"></i> ${titles[m.kind] || 'تعديل'}</h3>
                <div class="field">
                  <label>${isItem ? 'اسم المستطيل (اختياري)' : 'الاسم'}</label>
                  <input type="text" id="modal-name" value="${(m.name||'').replace(/"/g,'&quot;')}" placeholder="${isItem ? 'يمكن تركه فارغًا' : 'اكتب اسم...'}" />
                </div>
                <div class="field">
                  <label>الصورة (اختيارية)</label>
                  <div class="file-pick">
                    <div class="prev ${hasImage ? 'has-image' : ''}" style="${hasImage ? `background-image:url(${m.image})` : ''}">${!hasImage ? '📷' : ''}</div>
                    <label class="upl">اختر صورة<input type="file" id="modal-image" accept="image/*"></label>
                    <span class="fname">${hasImage ? 'تم اختيار صورة' : 'لا توجد صورة'}</span>
                  </div>
                </div>
                ${isItem ? `
                <div class="field">
                  <label>ملف مرفق (اختياري)</label>
                  <div class="file-pick">
                    <label class="upl">اختر ملف<input type="file" id="modal-file"></label>
                    <span class="fname">${hasFile ? m.fileName || 'تم اختيار ملف' : 'لا يوجد ملف'}</span>
                  </div>
                </div>
                <div class="field announce-panel">
                  <label class="announce-toggle-row">
                    <input type="checkbox" id="announce-on-publish" ${m.announceEnabled?'checked':''} onchange="state.modal.announceEnabled=this.checked; document.getElementById('announce-audience-wrap').style.display=this.checked?'block':'none'">
                    <span><i class="fas fa-bullhorn"></i> إعلان بالنشر — ابعت إشعار تلقائيًا عند نشر/رفع ملف هذا المستطيل.</span>
                  </label>
                  <div class="field" id="announce-audience-wrap" style="display:${m.announceEnabled?'block':'none'};margin-top:10px">
                    <label>مين يستلم؟</label>
                    <select id="announce-audience-mode" onchange="document.getElementById('announce-users-wrap').style.display=this.value==='selected'?'block':'none';document.getElementById('announce-excluded-wrap').style.display=this.value==='excluded'?'block':'none'">
                      <option value="all" ${(!m.announceAudienceMode||m.announceAudienceMode==='all')?'selected':''}>الكل</option>
                      <option value="selected" ${m.announceAudienceMode==='selected'?'selected':''}>أشخاص محددون</option>
                      <option value="excluded" ${m.announceAudienceMode==='excluded'?'selected':''}>الكل ما عدا أشخاص</option>
                    </select>
                    <label style="margin-top:10px">العنوان الافتراضي</label>
                    <input type="text" id="announce-title" maxlength="120" value="${escapeHtml(m.announceTitle||'رفع ملف جديد 🙂')}">
                    <div class="notif-publish-preview" style="margin-top:9px"><strong>المعاينة:</strong> سيتم إرسال العنوان أعلاه، والموضوع تلقائيًا: تم رفع اسم الملف في اسم المجلد الفرعي.</div>
                    <div class="field" id="announce-users-wrap" style="display:${m.announceAudienceMode==='selected'?'block':'none'};margin-top:8px">
                      <label>الأشخاص المحددون</label>
                      <select id="announce-users" class="access-multi" multiple>${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${((m.announceUserIds||[]).includes(String(u.id)))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}</select>
                    </div>
                    <div class="field" id="announce-excluded-wrap" style="display:${m.announceAudienceMode==='excluded'?'block':'none'};margin-top:8px">
                      <label>الأشخاص المستثنون</label>
                      <select id="announce-excluded" class="access-multi" multiple>${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${((m.announceExcludedUserIds||[]).includes(String(u.id)))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}</select>
                    </div>
                    <small class="access-help">هتظهرلك رسالة تأكيد قبل الإرسال.</small>
                  </div>
                </div>` : ''}
                <div class="field">
                  <label>تنسيق الاسم</label>
                  <div class="text-format-tools">
                    <button type="button" class="${m.textBold!==false?'active':''}" id="text-bold-toggle" data-bold-value="${m.textBold!==false?'1':'0'}">𝗕 عريض</button>
                    <button type="button" class="color-swatch color-white ${m.textColor==='#ffffff'?'active':''}" data-text-color="#ffffff" title="أبيض"></button>
                    <button type="button" class="color-swatch color-black ${(!m.textColor||m.textColor==='#111827')?'active':''}" data-text-color="#111827" title="أسود"></button>
                    <button type="button" class="color-swatch color-gold ${m.textColor==='#c58a13'?'active':''}" data-text-color="#c58a13" title="ذهبي"></button>
                    <button type="button" class="color-swatch color-red ${m.textColor==='#dc2626'?'active':''}" data-text-color="#dc2626" title="أحمر"></button>
                    <button type="button" class="color-swatch color-purple ${m.textColor==='#7c3aed'?'active':''}" data-text-color="#7c3aed" title="بنفسجي"></button>
                    <button type="button" class="color-swatch color-sky ${m.textColor==='#0ea5e9'?'active':''}" data-text-color="#0ea5e9" title="سماوي"></button>
                    <button type="button" class="color-swatch color-green ${m.textColor==='#16a34a'?'active':''}" data-text-color="#16a34a" title="أخضر"></button>
                    <button type="button" class="color-swatch color-blue ${m.textColor==='#2563eb'?'active':''}" data-text-color="#2563eb" title="أزرق"></button>
                    <button type="button" class="color-swatch color-orange ${m.textColor==='#f97316'?'active':''}" data-text-color="#f97316" title="برتقالي"></button>
                    <button type="button" class="color-swatch color-teal ${m.textColor==='#14b8a6'?'active':''}" data-text-color="#14b8a6" title="فيروزي"></button>
                    <button type="button" class="color-swatch color-pink ${m.textColor==='#db2777'?'active':''}" data-text-color="#db2777" title="وردي"></button>
                    <button type="button" class="color-swatch color-violet ${m.textColor==='#6d28d9'?'active':''}" data-text-color="#6d28d9" title="بنفسجي غامق"></button>
                    <button type="button" class="color-swatch color-cyan ${m.textColor==='#0891b2'?'active':''}" data-text-color="#0891b2" title="سماوي غامق"></button>
                    <button type="button" class="color-swatch color-lime ${m.textColor==='#84cc16'?'active':''}" data-text-color="#84cc16" title="ليموني"></button>
                    <button type="button" class="color-swatch color-brown ${m.textColor==='#92400e'?'active':''}" data-text-color="#92400e" title="بني"></button>
                    <button type="button" class="color-swatch color-rose ${m.textColor==='#e11d48'?'active':''}" data-text-color="#e11d48" title="وردي داكن"></button>
                  </div>
                </div>
                <div class="content-access-panel">
                  <div class="availability-title"><i class="fas fa-eye"></i><span>إتاحة هذا المحتوى</span></div>
                  <div class="field"><label>يظهر لـ</label><select id="content-visibility">
                    <option value="all" ${m.visibilityMode==='all'?'selected':''}>🌍 الكل</option>
                    <option value="selected" ${m.visibilityMode==='selected'?'selected':''}>👥 أشخاص أختارهم</option>
                    <option value="admins" ${m.visibilityMode==='admins'?'selected':''}>🛡️ المشرفين والأدمن</option>
                    <option value="owner" ${m.visibilityMode==='owner'?'selected':''}>🔒 أنا فقط</option>
                  </select></div>
                  <div class="field access-users-field" style="display:${m.visibilityMode==='selected'?'block':'none'}"><label>اختار الناس اللي يظهر لهم</label><select id="content-allow-users" class="access-multi" multiple>${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${((m.allowedUsers||[]).includes(String(u.id)))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}</select><small class="access-help">على الكمبيوتر استخدم Ctrl، وعلى الموبايل اضغط على الأشخاص اللي عايز تحددهم.</small></div>
                  <div class="field"><label>استثناء — ناس ما يظهرش لهم</label><select id="content-deny-users" class="access-multi" multiple>${(state.users||[]).filter(u=>u.role!=='admin'&&u.role!=='super_admin').map(u=>`<option value="${escapeHtml(u.id)}" ${((m.excludedUsers||[]).includes(String(u.id)))?'selected':''}>${escapeHtml(userDisplayName(u))} — ${escapeHtml(u.email||'بدون بريد')}</option>`).join('')}</select><small class="access-help">الاستثناء أقوى من الإتاحة، ويمكن استخدامه مع أي اختيار.</small></div>
                </div>
                <div class="modal-actions">
                  <button class="btn-save" data-act="save-modal">حفظ</button>
                  <button class="btn-cancel" data-act="close-modal">إلغاء</button>
                </div>
                ${showDelete ? `<button class="btn-danger block" data-act="delete-modal">حذف</button>` : ''}
              </div>
            </div>`;
        }

        // ─── Confirm ───

        function renderConfirm() {
            return `
            <div class="overlay" data-act="close-confirm-overlay">
              <div class="modal confirm-box" data-stop="1">
                <p>${state.confirm.message}</p>
                <div class="modal-actions">
                  <button class="${state.confirm.confirmClass || 'btn-danger'}" data-act="confirm-yes">${escapeHtml(state.confirm.confirmLabel || 'تأكيد')}</button>
                  <button class="btn-cancel" data-act="close-confirm">إلغاء</button>
                </div>
              </div>
            </div>`;
        }

        // ════════════════════════════════════════════════════════════════════
        //  EVENTS
        // ════════════════════════════════════════════════════════════════════

        function attachEvents() {
            enhanceAccessMultiSelects();
            enhanceNiceFileInputs();
            document.querySelectorAll('[data-act]').forEach(el => {
                el.removeEventListener('click', onAction);
                el.addEventListener('click', onAction);
            });

            // File inputs - manager avatar
            const managerAvatarInput=document.getElementById('manager-avatar');
            if(managerAvatarInput){ managerAvatarInput.removeEventListener('change',onManagerAvatarChange); managerAvatarInput.addEventListener('change',onManagerAvatarChange); }
            const managerPageAvatarInput=document.getElementById('manager-page-avatar-input');
            if(managerPageAvatarInput){
                managerPageAvatarInput.removeEventListener('change',onManagerPageAvatarChange);
                managerPageAvatarInput.addEventListener('change',onManagerPageAvatarChange);
            }
            const platformButtonImage=document.getElementById('platform-btn-image');
            if(platformButtonImage){
                platformButtonImage.removeEventListener('change',onPlatformButtonImageChange);
                platformButtonImage.addEventListener('change',onPlatformButtonImageChange);
            }
            const platformButtonAudience=document.getElementById('platform-btn-audience');
            if(platformButtonAudience){
                platformButtonAudience.removeEventListener('change',onPlatformButtonAudienceChange);
                platformButtonAudience.addEventListener('change',onPlatformButtonAudienceChange);
            }

            // File inputs - avatar
            const avatarInput = document.getElementById('modal-avatar');
            if (avatarInput) {
                avatarInput.removeEventListener('change', onAvatarChange);
                avatarInput.addEventListener('change', onAvatarChange);
            }

            // File inputs - image
            const imgInput = document.getElementById('modal-image');
            if (imgInput) {
                imgInput.removeEventListener('change', onImageChange);
                imgInput.addEventListener('change', onImageChange);
            }

            // File inputs - file
            const fileInput = document.getElementById('modal-file');
            if (fileInput) {
                fileInput.removeEventListener('change', onFileChange);
                fileInput.addEventListener('change', onFileChange);
            }

            const userSearch = document.getElementById('userSearch');
            if(userSearch){
                userSearch.addEventListener('input', e=>{
                    state.usersSearch=e.target.value;
                    const caret=e.target.selectionStart;
                    render();
                    const next=document.getElementById('userSearch');
                    if(next){ next.focus(); try{next.setSelectionRange(caret,caret);}catch(_){ } }
                });
            }


            const wvAudience=document.getElementById('welcome-video-audience');
            if(wvAudience){
              wvAudience.addEventListener('change',()=>{
                const box=document.getElementById('welcome-video-recipients-box');
                if(box) box.classList.toggle('show', wvAudience.value==='selected');
              });

        async function onAction(e) {
            const el = e.currentTarget;
            const act = el.dataset.act;

            // ─── Admin controls must never trigger the parent Card click ───
            if (el.closest('.card-admin-actions')) {
                e.stopPropagation();
            }

            // ─── Modal overlay: only close if click is directly on overlay ───
            if (act === 'close-modal-overlay') {
                // Only close if the click target is the overlay itself (not a child)
                if (e.target === el) {
                    closeModal();
                }
                return;
            }

            if (act === 'close-confirm-overlay') {
                if (e.target === el) {
                    closeConfirm();
                }
                return;
            }

            // ─── Any click inside a modal is never an overlay click ───
            if (el.closest('.modal') && act !== 'close-modal' && act !== 'close-confirm') {
                // Keep processing the button's own action, but never let it close the overlay.
                e.stopPropagation();
            }

            // ─── Standard actions ───
            if (act === 'close-modal') {
                const modalKind = state.modal?.kind;
                const wasFirst = modalKind === 'first-welcome';
                const wasUserMessage = modalKind === 'user-message';
                const currentMessages = wasUserMessage && Array.isArray(state.modal?.messages)
                    ? [...state.modal.messages] : [];
                const pending = Array.isArray(state.pendingUserMessages) ? [...state.pendingUserMessages] : [];
                if (wasUserMessage && currentMessages.length) {
                    const saved = await markUserMessagesSeen(currentMessages.map(x=>x.id));
                    if(!saved) {
                        showToast('لم يتم تسجيل قراءة رسالة الإدارة في قاعدة البيانات. جرّب مرة أخرى.','error');
                        return;
                    }
                    state.pendingUserMessages = [];
                }
                closeModal();
                if (wasFirst) {
                    if (!state.user.phone) { openModal('phone-required',{}); }
                    else if (pending.length) {
                        openModal('user-message',{messages:pending});
                        state.pendingUserMessages=[];
                    }
                    else { /* video is shown before the first welcome, not after it */ }
                }
                return;
            }
            if (act === 'close-confirm') {
                closeConfirm();
                return;
            }

            // ─── Stop propagation for any modal inner clicks ───
            if (el.dataset.stop) return;

            switch (act) {
                case 'login': {
                    // لا يوجد اختيار للدور هنا؛ الدور يأتي من Supabase.
                    return;
                }
                case 'open-admin-panel': {
                    if (!isAdmin()) {
                        showToast('غير مصرح به', 'error');
                        break;
                    }
                    await openUsersManagement();
                    break;
                }
                case 'user-filter': {
                    state.usersFilter = el.dataset.filter || 'all';
                    render();
                    break;
                }
                case 'refresh-users': {
                    await openUsersManagement();
                    break;
                }
                case 'user-details': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-details',{user:u});
                    break;
                }
                case 'user-edit': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-edit',{user:u});
                    break;
                }
                case 'user-welcome': {
                    const u=state.users.find(x=>String(x.id)===String(el.dataset.userId));
                    if(u) openModal('user-welcome',{user:u,mode:'ready'});
                    break;
                }
                case 'welcome-mode': {
                    const u=state.modal?.user||state.users.find(x=>String(x.id)===String(state.modal?.userId));
                    openModal('user-welcome',{user:u,mode:el.dataset.mode==='custom'?'custom':'ready'});
                    break;
                }
                case 'compose-user-message': {
                    openModal('compose-user-message',{targetUserId:'all'});
                    break;
                }
                case 'message-target': {
                    const target=el.dataset.target==='one' ? (state.users.find(u=>u.role!=='admin')?.id || 'all') : 'all';
                    openModal('compose-user-message',{targetUserId:target});
                    break;
                }
                case 'send-user-welcome': {
                    const m=state.modal||{}; const u=m.user||{};
                    const custom=m.mode==='custom';
                    const title=(document.getElementById('welcome-message-title')?.value||'').trim();
                    const body=(document.getElementById('welcome-message-body')?.value||'').trim();
                    const mediaFile=document.getElementById('welcome-message-media')?.files?.[0]||null;
                    const readyTitle=`أهلا بيك يا ${userDisplayName(u)} 👋`;
                    const readyBody='نورتنا ✨ نتمنى تلاقي كل اللي محتاجه هنا وتكون تجربتك داخل المنصة أسهل وأفضل.';
                    const finalTitle=custom?title:readyTitle;
                    let finalBody=custom?body:readyBody;
                    if(!finalTitle || (!finalBody && !mediaFile)) return showToast('أكمل عنوان الرسالة ونصها أو اختر مرفقًا.','error');
                    if(mediaFile && mediaFile.size>25*1024*1024) return showToast('حجم المرفق يجب ألا يتجاوز 25 ميجابايت.','error');
                    const btn=el; btn.disabled=true; btn.textContent='جاري الإرسال…';
                    try{
                        let marker='';
                        if(mediaFile){
                            if(!(mediaFile.type.startsWith('image/')||mediaFile.type.startsWith('video/'))) throw new Error('الصورة أو الفيديو غير مدعوم.');
                            const ext=(mediaFile.name.split('.').pop()||'bin').toLowerCase();
                            const type=mediaFile.type.startsWith('video/')?'video':'image';
                            const path=`messages/${crypto.randomUUID()}.${ext}`;
                            const up=await sb.storage.from('admin-messages').upload(path,mediaFile,{upsert:false,contentType:mediaFile.type||undefined});
                            if(up.error) throw up.error;
                            marker=`[[MIDAD_MEDIA|${type}|${encodeURIComponent(path)}]]`;
                        }
                        if(marker) finalBody=(finalBody?finalBody+'\n\n':'')+marker;
                        const {data:welcomeRow,error}=await sb.from('user_messages').insert({target_user_id:u.id,title:finalTitle,body:finalBody,max_views:1,is_active:true,message_kind:'welcome'}).select('id').single();
                        if(error) throw error;
                        const tracked=await sb.rpc('midad_register_welcome_message',{p_message_id:welcomeRow.id,p_user_id:u.id});
                        if(tracked.error) throw tracked.error;
                        await sendNativePush({title:finalTitle,body:finalBody.replace(/\[\[MIDAD_MEDIA\|.*?\]\]/g,'').trim(),url:'app/index.html?openNotifCenter=1',target_type:'selected',target_user_ids:[u.id]});
                        closeModal(); await openUsersManagement(); showToast('تم إرسال ترحيب أول مرة للحساب المحدد.','success');
                    }catch(err){showToast(`تعذر إرسال الترحيب: ${err.message||'خطأ غير معروف'}`,'error');btn.disabled=false;btn.textContent='إرسال الترحيب مرة واحدة';}
                    break;
                }
                case 'send-user-message': {
                    const title=(document.getElementById('admin-message-title')?.value||'').trim();
                    let body=(document.getElementById('admin-message-body')?.value||'').trim();
                    const targetUserId=document.getElementById('message-target-user')?.value || (state.modal?.targetUserId!=='all'?state.modal?.targetUserId:null);
                    const mediaFile=document.getElementById('admin-message-media')?.files?.[0]||null;
                    if(!title) return showToast('اكتب عنوان الرسالة.','error');
                    if(!body && !mediaFile) return showToast('اكتب نص الرسالة أو اختر مرفقًا.','error');
                    if(mediaFile && mediaFile.size>25*1024*1024) return showToast('حجم المرفق يجب ألا يتجاوز 25 ميجابايت.','error');
                    const btn=el;btn.disabled=true;btn.textContent='جاري الإرسال…';
                    try{
                        let mediaMarker='';
                        if(mediaFile){
                          const ext=(mediaFile.name.split('.').pop()||'bin').toLowerCase();
                          const type=mediaFile.type.startsWith('video/')?'video':'image';
                          const path=`messages/${crypto.randomUUID()}.${ext}`;
                          const up=await sb.storage.from('admin-messages').upload(path,mediaFile,{upsert:false,contentType:mediaFile.type||undefined});
                          if(up.error) throw up.error;
                          mediaMarker=`[[MIDAD_MEDIA|${type}|${encodeURIComponent(path)}]]`;
                        }
                        if(mediaMarker) body=(body?body+'\n\n':'')+mediaMarker;
                        const viewsRaw=document.getElementById('admin-message-views')?.value || '1';
                        const max_views=viewsRaw==='unlimited' ? null : Math.max(1,parseInt(viewsRaw,10)||1);
                        const {error}=await sb.from('user_messages').insert({target_user_id:targetUserId||null,title,body,max_views,is_active:true});
                        if(error) throw error;
                        await sendNativePush({title,body,url:'app/index.html?openNotifCenter=1',target_type:targetUserId?'selected':'all',target_user_ids:targetUserId?[targetUserId]:[]});
                        closeModal(); await openUsersManagement(); showToast(targetUserId?'تم إرسال الرسالة للحساب المحدد.':'تم إرسال الرسالة لجميع الحسابات.','success');
                    }catch(err){showToast(`تعذر إرسال الرسالة: ${err.message||'خطأ غير معروف'}`,'error');btn.disabled=false;btn.textContent='إرسال الرسالة';}
                    break;
                }
                case 'hide-admin-message': {
                    const messageId=el.dataset.messageId;
                    if(!messageId) break;
                    try{
                        const {error}=await sb.rpc('admin_hide_message',{p_message_id:messageId});
                        if(error) throw error;
                        state.adminMessages=(state.adminMessages||[]).filter(m=>String(m.id)!==String(messageId));
                        render();
                        showToast('تم إخفاء الرسالة من قائمتك.','success');
                    }catch(err){showToast(`تعذر إخفاء الرسالة: ${err.message||'خطأ غير معروف'}`,'error');}
                    break;
                }
                case 'delete-admin-message': {
                    const messageId=el.dataset.messageId;
                    if(!messageId) break;
                    const msg=(state.adminMessages||[]).find(m=>String(m.id)===String(messageId));
                    if(!msg) break;
                    const collective=!msg.target_user_id;
                    askConfirm(collective?'سيتم حذف هذه الرسالة نهائيًا ولن تظهر لأي حساب. هل تريد المتابعة؟':'سيتم حذف هذه الرسالة نهائيًا من قائمة الرسائل. هل تريد المتابعة؟', async()=>{
                        try{
                            const {error}=await sb.rpc('admin_delete_message',{p_message_id:messageId});
                            if(error) throw error;
                            closeConfirm();
                            await openUsersManagement();
                            showToast(collective?'تم حذف الرسالة عن الكل.':'تم حذف الرسالة.','success');
                        }catch(err){closeConfirm();showToast(`تعذر حذف الرسالة: ${err.message||'خطأ غير معروف'}`,'error');}
                    }, {confirmLabel:collective?'حذف عن الكل':'حذف الرسالة', confirmClass:'btn-danger'});
                    break;
                }
                case 'delete-all-admin-messages': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const ids=[...(state.adminMessages||[])].map(m=>m.id).filter(Boolean);
                    if(!ids.length) return showToast('لا توجد رسائل لإزالتها.','info');
                    askConfirm('سيتم حذف جميع الرسائل التي أرسلتها الإدارة نهائيًا، ولن تظهر للأعضاء بعد حذفها. هل تريد المتابعة؟', async()=>{
                        try{
                            const results=await Promise.all(ids.map(id=>sb.rpc('admin_delete_message',{p_message_id:id})));
                            const bad=results.find(r=>r?.error);
                            if(bad?.error) throw bad.error;
                            closeConfirm();
                            await openUsersManagement();
                            showToast('تم حذف جميع الرسائل بنجاح.','success');
                        }catch(err){closeConfirm();showToast(`تعذر حذف كل الرسائل: ${err.message||'خطأ غير معروف'}`,'error');}
                    }, {confirmLabel:'حذف الكل', confirmClass:'btn-danger'});
                    break;
                }

                case 'exclude-welcome-video-user': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const uid=el.dataset.userId;
                    if(!uid) break;
                    try{
                        const {error}=await sb.from('welcome_video_excluded').upsert({campaign_id:1,user_id:uid},{onConflict:'campaign_id,user_id'});
                        if(error) throw error;
                        await Promise.all([loadWelcomeVideoRecipientsStatus(),loadWelcomeVideoExcluded()]);
                        render();
                        const u=userById(uid)||{};
                        showToast(`تم استبعاد ${userDisplayName(u)} من فيديو الترحيب، ولن يصل إليه.`, 'success');
                    }catch(err){showToast(`تعذر استبعاد العضو: ${err.message||'خطأ غير معروف'}`,'error');}
                    break;
                }

                case 'choose-welcome-video': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const path=el.dataset.videoPath||'';
                    if(!path) return;
                    state.welcomeVideoDraftPath=path;
                    const select=document.getElementById('welcome-video-library-select');
                    if(select) select.value=path;
                    render();
                    showToast('تم تحديد الفيديو. اضغط حفظ لتطبيق الاختيار.','success');
                    break;
                }
                case 'preview-welcome-video': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const path=el.dataset.videoPath||'';
                    if(!path) return;
                    openModal('welcome-video-preview',{path,name:el.dataset.videoName||welcomeVideoDisplayName(path)});
                    break;
                }
                case 'delete-welcome-video': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const path=el.dataset.videoPath||'';
                    const name=el.dataset.videoName||welcomeVideoDisplayName(path);
                    if(!path) return;
                    askConfirm(`سيتم حذف «${name}» نهائيًا من Storage، وإذا كان هو الفيديو المحدد حاليًا سيتم إلغاء ربطه من إعدادات فيديو الترحيب. لا يمكن التراجع عن الحذف. هل تريد المتابعة؟`, async()=>{
                        try{
                            await deleteWelcomeVideoObject(path);
                            closeConfirm();
                            render();
                            showToast('تم حذف الفيديو نهائيًا.','success');
                        }catch(err){
                            closeConfirm();
                            showToast(`تعذر حذف الفيديو: ${err.message||'خطأ غير معروف'}`,'error');
                        }
                    },{confirmLabel:'حذف نهائي',confirmClass:'btn-danger'});
                    break;
                }

                case 'save-welcome-video': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const audience=document.getElementById('welcome-video-audience')?.value==='selected'?'selected':'all';
                    const active=document.getElementById('welcome-video-active')?.value!=='false';
                    const sel=document.getElementById('welcome-video-recipient-select');
                    const recipientIds=audience==='selected' ? [...(sel?.selectedOptions||[])].map(o=>o.value) : [];
                    const input=document.getElementById('welcome-video-file');
                    const file=input?.files?.[0];
                    const btn=el; btn.disabled=true; btn.textContent='جاري الحفظ…';
                    try{
                        const selectedMemberPath = audience==='selected' && recipientIds.length===1
                            ? (state.welcomeVideoCampaign?.recipient_video_paths?.[String(recipientIds[0])] || '')
                            : '';
                        let video_path=state.welcomeVideoDraftPath || document.getElementById('welcome-video-library-select')?.value || selectedMemberPath || (audience==='all' ? (state.welcomeVideoCampaign?.video_path||'') : '');
                        if(file){
                            if(!file.type.startsWith('video/')) throw new Error('اختار ملف فيديو صحيح.');
                            // Upload only when Save is pressed. As soon as Storage confirms,
                            // put the exact original filename into the visible library locally
                            // so the user does not wait for a second Storage.list() scan.
                            video_path=await uploadFile('welcome-videos',file,`campaign/${Date.now()}`);
                            state.welcomeVideoDraftPath=video_path;
                            const uploadedEntry={
                                path:video_path,
                                name:file.name||video_path.split('/').pop(),
                                size:file.size||0,
                                updated:new Date().toISOString(),
                                contentType:file.type||'video/mp4'
                            };
                            state.welcomeVideoLibrary=[uploadedEntry,...(state.welcomeVideoLibrary||[]).filter(v=>v.path!==video_path)];
                            render();
                        }
                        const {error:assignmentError}=await sb.rpc('midad_admin_save_welcome_video',{
                            p_video_path:video_path,
                            p_audience_mode:audience,
                            p_user_ids:recipientIds,
                            p_is_active:active
                        });
                        if(assignmentError) throw assignmentError;
                        await Promise.all([
                            loadWelcomeVideoCampaign(),
                            loadWelcomeVideoRecipientsStatus()
                        ]);
                        state.welcomeVideoDraftPath=video_path||'';
                        render();
                        showToast('تم حفظ إعدادات الفيديو، وسيظهر مرة واحدة للفئة المحددة.','success');
                        // Refresh Storage in the background; never block the UI on a full recursive scan.
                        void loadWelcomeVideoLibrary().then(()=>render());
                    }catch(err){showToast(`تعذر حفظ فيديو الترحيب: ${err.message||'خطأ غير معروف'}`,'error');}
                    finally{btn.disabled=false;btn.textContent='حفظ إعدادات الفيديو';}
                    break;
                }
                case 'save-welcome-video-excluded': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');

                    const excludedIds=[...(sel?.selectedOptions||[])].map(o=>o.value);
                    const btn=el; btn.disabled=true;
                    try{
                        await sb.from('welcome_video_excluded').delete().eq('campaign_id',1);
                        if(excludedIds.length){
                            const rows=excludedIds.map(user_id=>({campaign_id:1,user_id}));
                            const {error}=await sb.from('welcome_video_excluded').insert(rows);
                            if(error) throw error;
                        }
                        await loadWelcomeVideoExcluded();
                        render();
                        showToast('تم حفظ قائمة المستبعدين.','success');
                    }catch(err){showToast(`تعذر حفظ قائمة المستبعدين: ${err.message||'خطأ غير معروف — تأكد إن جدول welcome_video_excluded موجود'}`,'error');}
                    finally{btn.disabled=false;}
                    break;
                }
                case 'reset-welcome-video': {
                    if(!isAdmin()) return showToast('غير مصرح به','error');
                    const btn=el; btn.disabled=true;
                    try{
                        const audience=document.getElementById('welcome-video-audience')?.value==='selected'?'selected':'all';
                        const sel=document.getElementById('welcome-video-recipient-select');
                        const recipientIds=audience==='selected' ? [...(sel?.selectedOptions||[])].map(o=>o.value) : [];
                        const {error}=await sb.rpc('admin_reset_welcome_video',{p_audience_mode:audience,p_user_ids:recipientIds});
                        if(error) throw error;
                        await loadWelcomeVideoCampaign();
                        await loadWelcomeVideoRecipientsStatus();
                        showToast(audience==='selected'?'تمت إعادة الفيديو للأشخاص المحددين.':'تمت إعادة الفيديو لكل الحسابات.','success');
                        render();
                    }catch(err){showToast(`تعذر إعادة الفيديو: ${err.message||'خطأ غير معروف'}`,'error');}
                    finally{btn.disabled=false;}
                    break;
                }

                case 'user-create-temp': {
                    openModal('user-create-temp',{});
                    break;
                }
                case 'title-option': {
                    const picked=el.getAttribute('data-title-option');
                    const box=document.getElementById('um-selected-titles');
                    const hidden=document.getElementById('um-edit-title');
                    if(!box||!hidden||!picked) break;
                    const current=titleList(hidden.value);
                    const idx=current.indexOf(picked);

                case 'add-item': {
